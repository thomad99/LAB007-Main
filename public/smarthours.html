<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>SmartHours Admin | LAB007</title>
  <link rel="icon" type="image/png" href="/smarthours-assets/smarthours-logo.png">
  <link rel="apple-touch-icon" href="/smarthours-assets/smarthours-logo.png">
  <style>
    :root {
      --bg: #070b14;
      --panel: #10182a;
      --line: rgba(118, 244, 197, .22);
      --text: #f4f7ff;
      --muted: #9aa7bd;
      --accent: #76f4c5;
      --accent-dim: rgba(118, 244, 197, .14);
      --danger: #ff8f9f;
      --warn: #f2d27b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(118, 244, 197, .12), transparent 55%),
        radial-gradient(700px 380px at 90% 0%, rgba(90, 140, 255, .14), transparent 50%),
        linear-gradient(180deg, #05070f, #080c16 40%, #05070f);
    }
    .wrap { width: min(1280px, calc(100% - 28px)); margin: 0 auto; padding: 72px 0 48px; }
    header {
      display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
      justify-content: space-between; margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: -.03em; }
    .brand {
      display: flex; align-items: center; gap: 14px; min-width: 0;
    }
    .brand-logo {
      width: 52px; height: 52px; border-radius: 14px; flex: 0 0 auto;
      box-shadow: 0 10px 28px rgba(37, 99, 235, .28);
    }
    .brand-text { min-width: 0; }
    .sub { margin: 4px 0 0; color: var(--muted); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn, .btn-secondary, .btn-danger {
      appearance: none; border-radius: 10px; border: 1px solid transparent;
      padding: 10px 14px; font-weight: 700; cursor: pointer; font: inherit;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      text-decoration: none;
    }
    .btn { background: var(--accent); color: #04120e; }
    .btn-secondary { background: transparent; color: var(--accent); border-color: var(--line); }
    .btn-danger { background: transparent; color: var(--danger); border-color: rgba(255,143,159,.35); }
    .btn:disabled, .btn-secondary:disabled { opacity: .5; cursor: not-allowed; }
    .status { min-height: 22px; color: var(--accent); margin-bottom: 10px; font-size: .9rem; }
    .status.err { color: var(--danger); }
    .panel {
      background: rgba(16, 24, 42, .92); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.28);
    }
    .grid-main {
      display: grid; grid-template-columns: 280px 1fr; gap: 16px;
    }
    @media (max-width: 960px) { .grid-main { grid-template-columns: 1fr; } }
    .customer-list { display: grid; gap: 8px; max-height: 70vh; overflow: auto; }
    .customer-item {
      text-align: left; width: 100%; border: 1px solid var(--line); background: rgba(255,255,255,.02);
      color: var(--text); border-radius: 12px; padding: 12px; cursor: pointer; font: inherit;
    }
    .customer-item.active, .customer-item:hover { border-color: var(--accent); background: var(--accent-dim); }
    .customer-item strong { display: block; }
    .customer-item span { color: var(--muted); font-size: .82rem; }
    .editor { display: none; }
    .editor.open { display: grid; gap: 16px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tabs button.active { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    label { display: block; font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: #0a1020; color: var(--text); font: inherit;
    }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .hours-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .hours-table th, .hours-table td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.06); text-align: left; font-size: .9rem; }
    .hours-table input[type="time"] { padding: 6px 8px; }
    .hours-table input[type="checkbox"] { width: auto; }
    .hours-table tr.is-closed { opacity: .55; }
    .hours-table tr.is-closed td { color: var(--muted); }
    .hours-table .closed-label {
      display: none;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: .82rem;
      color: var(--muted);
    }
    .hours-table tr.is-closed .hours-times { display: none; }
    .hours-table tr.is-closed .closed-label { display: inline; }
    .hours-table .hours-times {
      display: grid;
      grid-template-columns: auto 1fr auto 1fr;
      gap: 6px 8px;
      align-items: center;
      max-width: 320px;
    }
    .hours-table .hours-times .time-label {
      font-size: .72rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .btn-sync {
      background: linear-gradient(135deg, #5eead4, #34d399);
      color: #042f2e;
      border: none;
      box-shadow: 0 8px 22px rgba(52, 211, 153, .28);
      min-width: 168px;
      position: relative;
    }
    .btn-sync:hover { filter: brightness(1.05); }
    .btn-sync:disabled,
    .btn:disabled,
    .btn-secondary:disabled {
      opacity: .72;
      cursor: wait;
      filter: none;
    }
    .btn-sync.is-busy,
    .btn-secondary.is-busy {
      position: relative;
      padding-left: 2.4rem;
    }
    .btn-sync.is-busy::before,
    .btn-secondary.is-busy::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: sh-spin .7s linear infinite;
    }
    @keyframes sh-spin {
      to { transform: rotate(360deg); }
    }
    .status.is-busy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .status.is-busy::before {
      content: '';
      width: 12px;
      height: 12px;
      border: 2px solid var(--accent);
      border-right-color: transparent;
      border-radius: 50%;
      animation: sh-spin .7s linear infinite;
      flex: 0 0 auto;
    }
    .auto-sync-bar {
      margin-top: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.03);
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: end;
    }
    .auto-sync-bar label {
      margin: 0;
      display: block;
      font-size: .72rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .auto-sync-bar input {
      width: 88px;
      margin-top: 4px;
    }
    .hours-toolbar {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .hours-toolbar .manual-opt {
      display: flex;
      gap: 8px;
      align-items: center;
      text-transform: none;
      letter-spacing: 0;
      font-size: .9rem;
      color: var(--muted);
      font-weight: 500;
    }
    .hours-toolbar .manual-opt input { width: auto; margin: 0; }
    .url-box {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px;
      padding: 10px 12px; border-radius: 12px; background: var(--accent-dim); border: 1px solid var(--line);
    }
    .form-grid .url-box { margin-top: 0; }
    .url-box a { color: var(--accent); word-break: break-all; }
    .design-layout {
      display: grid; grid-template-columns: 260px 1fr; gap: 12px;
    }
    @media (max-width: 900px) { .design-layout { grid-template-columns: 1fr; } }
    .controls {
      display: grid; gap: 8px; align-content: start;
      max-height: min(78vh, 900px); overflow: auto; padding-right: 4px;
    }
    .controls label {
      margin-bottom: 2px; font-size: .68rem;
    }
    .controls input, .controls select, .controls textarea {
      padding: 7px 8px; font-size: .85rem;
    }
    .controls .btn, .controls .btn-secondary, .controls .btn-danger {
      padding: 7px 9px; font-size: .78rem; border-radius: 8px;
    }
    .controls .hint { margin-top: 4px; font-size: .78rem; }
    .ctrl-block {
      padding: 8px; border: 1px solid var(--line); border-radius: 10px;
      background: rgba(255,255,255,.02); display: grid; gap: 6px;
    }
    .ctrl-block > .block-title {
      margin: 0; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); font-weight: 700;
    }
    .add-row {
      display: flex; flex-wrap: wrap; gap: 5px;
    }
    .add-row .btn-secondary.active,
    .add-row .btn-secondary.active:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .toggle-row {
      display: flex; flex-wrap: wrap; gap: 6px 10px;
    }
    .toggle-row label {
      display: inline-flex; gap: 5px; align-items: center;
      text-transform: none; letter-spacing: 0; font-size: .78rem;
      color: var(--text); margin: 0; font-weight: 500;
    }
    .toggle-row input { width: auto; margin: 0; }
    .canvas-stage {
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 480px; overflow: auto; padding: 12px; background: #ffffff; border-radius: 12px;
      border: 1px solid var(--line);
    }
    .tablet-frame {
      width: 800px; height: 480px; position: relative; border-radius: 0;
      overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,.45); background: #ffffff;
      flex-shrink: 0; transform-origin: top center;
    }
    .palette-swatches { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
    .palette-swatch {
      width: 22px; height: 22px; border-radius: 5px; border: 2px solid rgba(255,255,255,.25);
      cursor: pointer; padding: 0;
    }
    .palette-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .screen-settings {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 0;
      padding-bottom: 0; border-bottom: 0;
    }
    @media (max-width: 700px) { .screen-settings { grid-template-columns: 1fr; } }
    .color-triple {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
    }
    .color-triple .color-row { grid-template-columns: 1fr 32px; gap: 4px; }
    .canvas-el {
      position: absolute; border: 1px dashed transparent; cursor: grab; user-select: none;
      padding: 0; overflow: hidden; box-sizing: border-box;
    }
    .canvas-el:hover, .canvas-el.selected { border-color: var(--accent); }
    .canvas-el.dragging { cursor: grabbing; opacity: .92; z-index: 5; }
    .canvas-el.sketching { cursor: crosshair; }
    .canvas-el .handle {
      position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
      background: var(--accent); border-radius: 3px 0 0 0; cursor: nwse-resize;
    }
    .preview-logo { max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: 0 auto; }
    .preview-title { font-weight: 800; text-align: center; line-height: 1.15; }
    .preview-status { text-align: center; font-weight: 700; letter-spacing: .04em; }
    .preview-hours { width: 100%; }
    .preview-hours .row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,.08); font-weight: 600;
    }
    .preview-sketch {
      width: 100%; height: 100%; object-fit: contain; display: block; background: transparent;
      pointer-events: none;
    }
    .preview-sketch-empty {
      width: 100%; height: 100%; display: grid; place-items: center;
      opacity: .5; font-size: .75rem; border: 1px dashed currentColor; color: inherit;
    }
    .hint { color: var(--muted); font-size: .86rem; line-height: 1.45; margin-top: 10px; }
    .color-row { display: grid; grid-template-columns: 1fr 48px; gap: 8px; align-items: center; }
    .gallery-list { display: grid; gap: 6px; margin-top: 6px; max-height: 140px; overflow: auto; }
    .gallery-item {
      display: grid; grid-template-columns: 44px 1fr auto; gap: 6px; align-items: center;
      border: 1px solid var(--line); border-radius: 8px; padding: 4px; background: rgba(255,255,255,.02);
    }
    .gallery-item img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #000; }
    .gallery-item label { display: flex; gap: 6px; align-items: center; font-size: .75rem; color: var(--muted); text-transform: none; letter-spacing: 0; margin: 0; }
    .preview-badge {
      width: 100%; height: 100%; display: grid; place-items: center; border-radius: 16px;
      font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
    }
    .preview-slide {
      width: 100%; height: 100%; object-fit: cover; border-radius: 12px; background: #000; display: block;
    }
    .el-props { margin-top: 0; display: grid; gap: 6px; }
    .hidden-block { display: none !important; }
    .canvas-el .del-x {
      position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border: 0;
      border-radius: 6px; background: rgba(255,80,100,.9); color: #fff; font-weight: 800;
      cursor: pointer; line-height: 1; z-index: 3;
    }
    .canvas-el.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  </style>
</head>
<body>
  <div id="app" class="wrap">
    <header>
      <div class="brand">
        <img class="brand-logo" src="/smarthours-assets/smarthours-logo.png" width="52" height="52" alt="SmartHours">
        <div class="brand-text">
          <h1>SmartHours</h1>
        </div>
      </div>
      <div class="toolbar">
        <a class="btn-secondary" href="/SmartHours/about">About</a>
        <button type="button" class="btn" id="newCustomerBtn">New Customer</button>
        <button type="button" class="btn-secondary" id="syncAllBtn">Sync All Google</button>
      </div>
    </header>
    <div class="status" id="status"></div>
    <div class="grid-main">
      <aside class="panel">
        <div class="customer-list" id="customerList"></div>
      </aside>
      <section class="panel editor" id="editor">
        <div class="tabs">
          <button type="button" class="btn-secondary active" data-tab="details">Details & Hours</button>
          <button type="button" class="btn-secondary" data-tab="design">Design Canvas</button>
          <button type="button" class="btn-secondary" data-tab="esp32">ESP32 / E-ink</button>
        </div>

        <div class="tab-panel active" id="tab-details">
          <div class="form-grid">
            <div>
              <label for="fieldName">Customer name</label>
              <input id="fieldName" type="text">
            </div>
            <div>
              <label for="fieldSlug">URL slug</label>
              <input id="fieldSlug" type="text" placeholder="acme-cafe">
            </div>
            <div class="full">
              <label for="fieldMapsUrl">Google business link</label>
              <input id="fieldMapsUrl" type="text" placeholder="Google Maps / place URL">
            </div>
            <div class="full auto-sync-bar">
              <div>
                <label for="autoSyncHours">Auto Google sync (hours)</label>
                <input id="autoSyncHours" type="number" min="0" max="168" step="1" value="24" title="0 disables auto sync">
              </div>
              <button type="button" class="btn-secondary" id="saveAutoSyncBtn">Save interval</button>
            </div>
          </div>
          <div class="hours-toolbar">
            <button type="button" class="btn btn-sync" id="syncOneBtn">Sync Google hours</button>
            <label class="manual-opt">
              <input id="fieldManual" type="checkbox"> Manual hours
            </label>
          </div>
          <p class="hint" id="syncMeta"></p>
          <table class="hours-table">
            <thead>
              <tr>
                <th>Day</th>
                <th>Closed</th>
                <th>Hours</th>
              </tr>
            </thead>
            <tbody id="hoursBody"></tbody>
          </table>
          <div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn" id="saveBtn">Save Customer</button>
            <button type="button" class="btn-danger" id="deleteBtn">Delete</button>
          </div>
        </div>

        <div class="tab-panel" id="tab-design">
          <div class="design-layout">
            <div class="controls">
              <div class="ctrl-block">
                <p class="block-title">Screen</p>
                <div class="screen-settings">
                  <div>
                    <label for="screenOrientation">Orientation</label>
                    <select id="screenOrientation">
                      <option value="landscape">Landscape</option>
                      <option value="portrait">Portrait</option>
                    </select>
                  </div>
                  <div>
                    <label for="screenColorMode">Colors</label>
                    <select id="screenColorMode">
                      <option value="6color">6-color</option>
                      <option value="4color">4-color</option>
                      <option value="grayscale">Grayscale</option>
                    </select>
                  </div>
                  <div>
                    <label for="einkWidthDesign">W</label>
                    <input id="einkWidthDesign" type="number" min="200" max="2500" value="800">
                  </div>
                  <div>
                    <label for="einkHeightDesign">H</label>
                    <input id="einkHeightDesign" type="number" min="120" max="2500" value="480">
                  </div>
                </div>
              </div>

              <div class="ctrl-block">
                <p class="block-title">Look</p>
                <div class="color-triple">
                  <div>
                    <label for="bgColor">BG</label>
                    <div class="color-row">
                      <input id="bgColor" type="text" value="#FFFFFF">
                      <input id="bgColorPick" type="color" value="#FFFFFF">
                    </div>
                    <div class="palette-swatches" data-palette-for="bg"></div>
                  </div>
                  <div>
                    <label for="textColor">Text</label>
                    <div class="color-row">
                      <input id="textColor" type="text" value="#000000">
                      <input id="textColorPick" type="color" value="#000000">
                    </div>
                    <div class="palette-swatches" data-palette-for="text"></div>
                  </div>
                  <div>
                    <label for="accentColor">Accent</label>
                    <div class="color-row">
                      <input id="accentColor" type="text" value="#FF0000">
                      <input id="accentColorPick" type="color" value="#FF0000">
                    </div>
                    <div class="palette-swatches" data-palette-for="accent"></div>
                  </div>
                </div>
                <div class="form-grid" style="grid-template-columns:1.4fr .7fr .7fr .7fr;gap:6px;">
                  <div>
                    <label for="fontFamily">Font</label>
                    <select id="fontFamily">
                      <option value='Georgia, "Times New Roman", serif'>Georgia</option>
                      <option value='"Palatino Linotype", Palatino, serif'>Palatino</option>
                      <option value='"Trebuchet MS", sans-serif'>Trebuchet</option>
                      <option value='"Segoe UI", Arial, sans-serif'>Segoe UI</option>
                      <option value='Impact, Haettenschweiler, sans-serif'>Impact</option>
                      <option value='"Courier New", monospace'>Courier</option>
                    </select>
                  </div>
                  <div>
                    <label for="titleSize">Title</label>
                    <input id="titleSize" type="number" min="12" max="72" value="34">
                  </div>
                  <div>
                    <label for="hoursSize">Hours</label>
                    <input id="hoursSize" type="number" min="12" max="48" value="22">
                  </div>
                  <div>
                    <label for="statusSize">Status</label>
                    <input id="statusSize" type="number" min="12" max="48" value="20">
                  </div>
                </div>
                <div class="form-grid" style="gap:6px;">
                  <div>
                    <label for="logoFile">Logo</label>
                    <input id="logoFile" type="file" accept="image/*">
                  </div>
                  <div>
                    <label for="statusMode">OPEN style</label>
                    <select id="statusMode">
                      <option value="badge">Badge</option>
                      <option value="text">Text</option>
                      <option value="image">Images</option>
                    </select>
                  </div>
                </div>
                <div class="form-grid" style="gap:6px;">
                  <div>
                    <label for="openMediaSelect">OPEN img</label>
                    <select id="openMediaSelect"><option value="">— badge —</option></select>
                  </div>
                  <div>
                    <label for="closedMediaSelect">CLOSED img</label>
                    <select id="closedMediaSelect"><option value="">— badge —</option></select>
                  </div>
                </div>
              </div>

              <div class="ctrl-block">
                <p class="block-title">Elements</p>
                <div class="add-row">
                  <button type="button" class="btn-secondary" id="addTextBtn">+ Text</button>
                  <button type="button" class="btn-secondary" id="addSketchBtn">+ Sketch</button>
                  <button type="button" class="btn-secondary" id="addImageBtn">+ Image</button>
                  <button type="button" class="btn-secondary" id="addHoursBtn">+ Hours</button>
                  <button type="button" class="btn-secondary" id="addStatusBtn">+ Status</button>
                  <button type="button" class="btn-secondary" id="addLogoBtn">+ Logo</button>
                  <button type="button" class="btn-secondary" id="addTitleBtn">+ Title</button>
                  <button type="button" class="btn-secondary" id="addSlideshowBtn">+ Slides</button>
                  <button type="button" class="btn-danger" id="deleteElBtn">Delete</button>
                </div>
                <div class="toggle-row">
                  <label><input type="checkbox" id="showLogo" checked> Logo</label>
                  <label><input type="checkbox" id="showTitle" checked> Title</label>
                  <label><input type="checkbox" id="showStatus" checked> Status</label>
                  <label><input type="checkbox" id="showHours" checked> Hours</label>
                  <label><input type="checkbox" id="showSlideshow"> Slides</label>
                </div>
                <div id="elProps" class="el-props hidden-block">
                  <div id="elTextProps">
                    <label for="elText">Text</label>
                    <textarea id="elText" rows="2" placeholder="Text content"></textarea>
                    <div class="form-grid" style="gap:6px;">
                      <div>
                        <label for="elFontSize">Size</label>
                        <input id="elFontSize" type="number" min="10" max="120" value="28">
                      </div>
                      <div>
                        <label for="elAlign">Align</label>
                        <select id="elAlign">
                          <option value="left">Left</option>
                          <option value="center">Center</option>
                          <option value="right">Right</option>
                        </select>
                      </div>
                      <div>
                        <label for="elColor">Color</label>
