  <script src="/lab007-site-nav.js" defer></script>
  <script>
    (function () {
      const DAYS = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
      const DAY_LABELS = {
        monday:'Monday', tuesday:'Tuesday', wednesday:'Wednesday', thursday:'Thursday',
        friday:'Friday', saturday:'Saturday', sunday:'Sunday'
      };
      const TABLET = { width: 800, height: 480 };
      const COLOR_PALETTES = {
        '6color': ['#000000', '#FFFFFF', '#FF0000', '#FFFF00', '#0000FF', '#00FF00'],
        '4color': ['#000000', '#FFFFFF', '#FF0000', '#FFFF00'],
        grayscale: ['#000000', '#555555', '#AAAAAA', '#FFFFFF']
      };

      const statusEl = document.getElementById('status');
      const customerList = document.getElementById('customerList');
      const editor = document.getElementById('editor');
      const hoursBody = document.getElementById('hoursBody');
      const tabletFrame = document.getElementById('tabletFrame');

      let customers = [];
      let selectedId = null;
      let selectedElId = null;
      let logoDataUrl = null;
      let dragState = null;
      let sketchMode = 'draw';
      let suppressPropsSync = false;
      let syncingScreenFields = false;
      let settings = { autoSyncIntervalHours: 24 };

      function setBusy(btn, busy, busyLabel) {
        if (!btn) return;
        if (busy) {
          if (!btn.dataset.label) btn.dataset.label = btn.textContent;
          btn.disabled = true;
          btn.classList.add('is-busy');
          if (busyLabel) btn.textContent = busyLabel;
        } else {
          btn.disabled = false;
          btn.classList.remove('is-busy');
          if (btn.dataset.label) btn.textContent = btn.dataset.label;
        }
      }

      function setStatus(msg, isErr, isBusy) {
        statusEl.textContent = msg || '';
        statusEl.classList.toggle('err', !!isErr);
        statusEl.classList.toggle('is-busy', !!isBusy && !isErr);
      }

      function resolveColorMode(mode) {
        return COLOR_PALETTES[mode] ? mode : '6color';
      }

      function currentColorMode() {
        return resolveColorMode(document.getElementById('screenColorMode').value);
      }

      function paletteColors() {
        return COLOR_PALETTES[currentColorMode()].slice();
      }

      function nearestPalette(hex) {
        const colors = paletteColors();
        const parse = (h) => {
          const m = String(h || '').trim().match(/^#?([0-9a-f]{6})$/i);
          if (!m) return [128, 128, 128];
          const n = parseInt(m[1], 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        };
        const [r, g, b] = parse(hex);
        let best = colors[0];
        let bestD = Infinity;
        colors.forEach((c) => {
          const [cr, cg, cb] = parse(c);
          const d = (cr - r) ** 2 + (cg - g) ** 2 + (cb - b) ** 2;
          if (d < bestD) {
            bestD = d;
            best = c;
          }
        });
        return best;
      }

      function setColorField(which, hex) {
        const snapped = nearestPalette(hex);
        if (which === 'bg') {
          document.getElementById('bgColor').value = snapped;
          document.getElementById('bgColorPick').value = snapped;
        } else if (which === 'text') {
          document.getElementById('textColor').value = snapped;
          document.getElementById('textColorPick').value = snapped;
        } else if (which === 'accent') {
          document.getElementById('accentColor').value = snapped;
          document.getElementById('accentColorPick').value = snapped;
        }
        renderPaletteSwatches();
      }

      function renderPaletteSwatches() {
        const colors = paletteColors();
        document.querySelectorAll('[data-palette-for]').forEach((wrap) => {
          const which = wrap.getAttribute('data-palette-for');
          const current =
            which === 'bg'
              ? document.getElementById('bgColor').value
              : which === 'text'
                ? document.getElementById('textColor').value
                : document.getElementById('accentColor').value;
          wrap.innerHTML = colors
            .map(
              (c) =>
                `<button type="button" class="palette-swatch${c.toLowerCase() === String(current).toLowerCase() ? ' active' : ''}" data-which="${which}" data-color="${c}" style="background:${c}" title="${c}" aria-label="${c}"></button>`
            )
            .join('');
        });
      }

      function applyTabletSize(width, height) {
        TABLET.width = Math.max(200, Math.min(2500, Number(width) || 800));
        TABLET.height = Math.max(120, Math.min(2500, Number(height) || 480));
        tabletFrame.style.width = TABLET.width + 'px';
        tabletFrame.style.height = TABLET.height + 'px';
        scaleTablet();
      }

      function syncScreenFields(fromDesign) {
        if (syncingScreenFields) return;
        syncingScreenFields = true;
        try {
          if (fromDesign) {
            document.getElementById('einkOrientation').value = document.getElementById('screenOrientation').value;
            document.getElementById('einkColorMode').value = document.getElementById('screenColorMode').value;
            document.getElementById('einkWidth').value = document.getElementById('einkWidthDesign').value;
            document.getElementById('einkHeight').value = document.getElementById('einkHeightDesign').value;
          } else {
            document.getElementById('screenOrientation').value = document.getElementById('einkOrientation').value;
            document.getElementById('screenColorMode').value = document.getElementById('einkColorMode').value;
            document.getElementById('einkWidthDesign').value = document.getElementById('einkWidth').value;
            document.getElementById('einkHeightDesign').value = document.getElementById('einkHeight').value;
          }
          applyTabletSize(
            document.getElementById('einkWidthDesign').value,
            document.getElementById('einkHeightDesign').value
          );
          renderPaletteSwatches();
        } finally {
          syncingScreenFields = false;
        }
      }

      function applyOrientationDefaults(orient) {
        const landscape = orient !== 'portrait';
        document.getElementById('einkWidthDesign').value = landscape ? 800 : 480;
        document.getElementById('einkHeightDesign').value = landscape ? 480 : 800;
        syncScreenFields(true);
      }

      function apiFetch(url, options) {
        return fetch(url, Object.assign({ credentials: 'omit' }, options || {}));
      }

      function selected() {
        return customers.find((c) => c.id === selectedId) || null;
      }

      function emptyDay() {
        return { closed: true, open: '09:00', close: '17:00', open2: '', close2: '' };
      }

      function defaultHours() {
        const hours = {};
        DAYS.forEach((d) => {
          hours[d] = emptyDay();
          if (d !== 'sunday') {
            hours[d].closed = false;
            hours[d].open = '09:00';
            hours[d].close = '17:00';
          }
        });
        return hours;
      }

      function defaultDesign() {
        const w = TABLET.width;
        const h = TABLET.height;
        return {
          backgroundColor: '#FFFFFF',
          textColor: '#000000',
          accentColor: '#FF0000',
          mutedColor: '#555555',
          fontFamily: 'Georgia, "Times New Roman", serif',
          titleFontSize: 28,
          hoursFontSize: 18,
          statusFontSize: 36,
          logoUrl: '',
          showLogo: true,
          showTitle: true,
          showStatus: true,
          showHours: true,
          showSlideshow: false,
          statusMode: 'badge',
          openMediaId: '',
          closedMediaId: '',
          slideshowIntervalSec: 8,
          slideshowMediaIds: [],
          layout: [
            { id: 'logo', type: 'logo', x: Math.round(w * 0.25), y: 12, w: Math.round(w * 0.5), h: Math.max(48, Math.round(h * 0.12)) },
            { id: 'title', type: 'title', x: 24, y: Math.round(h * 0.16), w: w - 48, h: Math.max(36, Math.round(h * 0.1)) },
            { id: 'status', type: 'status', x: 24, y: Math.round(h * 0.28), w: w - 48, h: Math.max(56, Math.round(h * 0.16)) },
            { id: 'hours', type: 'hours', x: 24, y: Math.round(h * 0.48), w: w - 48, h: Math.max(120, h - Math.round(h * 0.48) - 16) }
          ]
        };
      }

      function mediaUrl(customer, mediaItem) {
        if (!customer || !mediaItem) return '';
        if (mediaItem.url) return mediaItem.url;
        return `/api/smarthours/public/${encodeURIComponent(customer.id)}/media/${encodeURIComponent(mediaItem.id)}`;
      }

      function selectedSlideshowIds() {
        return Array.from(document.querySelectorAll('#galleryList [data-slide]:checked')).map((el) => el.value);
      }

      function renderGallery(customer) {
        const list = document.getElementById('galleryList');
        const openSel = document.getElementById('openMediaSelect');
        const closedSel = document.getElementById('closedMediaSelect');
        const media = (customer && customer.media) || [];
        const design = (customer && customer.design) || {};
        const slideIds = new Set(design.slideshowMediaIds || []);

        const optHtml = ['<option value="">— built-in badge —</option>']
          .concat(media.map((m) => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name || m.id)}</option>`))
          .join('');
        openSel.innerHTML = optHtml;
        closedSel.innerHTML = optHtml;
        openSel.value = design.openMediaId || '';
        closedSel.value = design.closedMediaId || '';

        if (!media.length) {
          list.innerHTML = '<p class="hint">No gallery images yet.</p>';
          return;
        }
        list.innerHTML = media.map((m) => `
          <div class="gallery-item" data-media-id="${escapeHtml(m.id)}">
            <img src="${escapeHtml(mediaUrl(customer, m))}" alt="">
            <div>
              <strong style="font-size:.86rem">${escapeHtml(m.name || m.id)}</strong>
              <label><input type="checkbox" data-slide value="${escapeHtml(m.id)}" ${slideIds.has(m.id) ? 'checked' : ''}> In slideshow</label>
            </div>
            <button type="button" class="btn-danger" style="padding:6px 10px;font-size:.75rem;" data-del-media="${escapeHtml(m.id)}">Delete</button>
          </div>
        `).join('');
      }

      function formatDay(day) {
        if (!day || day.closed) return 'Closed';
        const a = day.open && day.close ? `${day.open} – ${day.close}` : '';
        return a || 'Closed';
      }

      function isOpenNow(hours, date) {
        const now = date || new Date();
        const dayKey = DAYS[(now.getDay() + 6) % 7];
        const day = hours && hours[dayKey];
        if (!day || day.closed) return false;
        const mins = now.getHours() * 60 + now.getMinutes();
        const inSlot = (open, close) => {
          if (!open || !close) return false;
          const [oh, om] = String(open).split(':').map(Number);
          const [ch, cm] = String(close).split(':').map(Number);
          if (![oh, om, ch, cm].every(Number.isFinite)) return false;
          const start = oh * 60 + om;
          let end = ch * 60 + cm;
          if (end <= start) end += 24 * 60;
          const cur = mins < start && end > 24 * 60 ? mins + 24 * 60 : mins;
          return cur >= start && cur < end;
        };
        return inSlot(day.open, day.close) || inSlot(day.open2, day.close2);
      }

      function scaleTablet() {
        const stage = tabletFrame.parentElement;
        if (!stage) return;
        const pad = 24;
        const maxW = Math.max(160, stage.clientWidth - pad);
        const maxH = Math.max(280, Math.min(900, window.innerHeight - 200));
        const scale = Math.min(1, maxW / TABLET.width, maxH / TABLET.height);
        tabletFrame.style.transformOrigin = 'top center';
        tabletFrame.style.transform = `scale(${scale})`;
        // Drop unused layout height after scaling from the top
        tabletFrame.style.marginBottom = `${(scale - 1) * TABLET.height}px`;
        tabletFrame.style.marginLeft = '0';
        tabletFrame.style.marginRight = '0';
      }

      function syncHoursRowState(row) {
        if (!row) return;
        const closed = row.querySelector('[data-f="closed"]').checked;
        row.classList.toggle('is-closed', closed);
      }

      function readHoursFromForm() {
        const hours = {};
        DAYS.forEach((day) => {
          const row = hoursBody.querySelector(`tr[data-day="${day}"]`);
          hours[day] = {
            closed: row.querySelector('[data-f="closed"]').checked,
            open: row.querySelector('[data-f="open"]').value,
            close: row.querySelector('[data-f="close"]').value,
            open2: '',
            close2: ''
          };
        });
        return hours;
      }

      function renderHoursForm(hours) {
        const h = hours || defaultHours();
        hoursBody.innerHTML = DAYS.map((day) => {
          const d = h[day] || emptyDay();
          return `<tr data-day="${day}" class="${d.closed ? 'is-closed' : ''}">
            <td>${DAY_LABELS[day]}</td>
            <td><input type="checkbox" data-f="closed" ${d.closed ? 'checked' : ''}></td>
            <td>
              <span class="closed-label">Closed</span>
              <span class="hours-times">
                <span class="time-label">Open</span>
                <input type="time" data-f="open" value="${d.open || '09:00'}" aria-label="${DAY_LABELS[day]} open">
                <span class="time-label">Close</span>
                <input type="time" data-f="close" value="${d.close || '17:00'}" aria-label="${DAY_LABELS[day]} close">
              </span>
            </td>
          </tr>`;
        }).join('');
      }

      function readDesignFromForm(base) {
        const design = Object.assign({}, base || defaultDesign());
        design.backgroundColor = document.getElementById('bgColor').value.trim() || design.backgroundColor;
        design.textColor = document.getElementById('textColor').value.trim() || design.textColor;
        design.accentColor = document.getElementById('accentColor').value.trim() || design.accentColor;
        design.fontFamily = document.getElementById('fontFamily').value;
        design.titleFontSize = Number(document.getElementById('titleSize').value) || 34;
        design.hoursFontSize = Number(document.getElementById('hoursSize').value) || 22;
        design.statusFontSize = Number(document.getElementById('statusSize').value) || 48;
        design.statusMode = document.getElementById('statusMode').value || 'badge';
        design.openMediaId = document.getElementById('openMediaSelect').value || '';
        design.closedMediaId = document.getElementById('closedMediaSelect').value || '';
        design.slideshowIntervalSec = Number(document.getElementById('slideshowInterval').value) || 8;
        design.slideshowMediaIds = selectedSlideshowIds();
        const layout = Array.isArray(design.layout) ? design.layout : [];
        design.showLogo = layout.some((e) => e.type === 'logo');
        design.showTitle = layout.some((e) => e.type === 'title');
        design.showStatus = layout.some((e) => e.type === 'status');
        design.showHours = layout.some((e) => e.type === 'hours');
        design.showSlideshow = layout.some((e) => e.type === 'slideshow');
        return design;
      }

      function syncShowCheckboxes(design) {
        const layout = (design && design.layout) || [];
        document.getElementById('showLogo').checked = layout.some((e) => e.type === 'logo');
        document.getElementById('showTitle').checked = layout.some((e) => e.type === 'title');
        document.getElementById('showStatus').checked = layout.some((e) => e.type === 'status');
        document.getElementById('showHours').checked = layout.some((e) => e.type === 'hours');
        document.getElementById('showSlideshow').checked = layout.some((e) => e.type === 'slideshow');
      }

      function writeDesignToForm(design) {
        const d = design || defaultDesign();
        document.getElementById('bgColor').value = nearestPalette(d.backgroundColor);
        document.getElementById('bgColorPick').value = nearestPalette(d.backgroundColor);
        document.getElementById('textColor').value = nearestPalette(d.textColor);
        document.getElementById('textColorPick').value = nearestPalette(d.textColor);
        document.getElementById('accentColor').value = nearestPalette(d.accentColor);
        document.getElementById('accentColorPick').value = nearestPalette(d.accentColor);
        document.getElementById('fontFamily').value = d.fontFamily;
        document.getElementById('titleSize').value = d.titleFontSize;
        document.getElementById('hoursSize').value = d.hoursFontSize;
        document.getElementById('statusSize').value = d.statusFontSize || 36;
        document.getElementById('statusMode').value = d.statusMode || 'badge';
        document.getElementById('slideshowInterval').value = d.slideshowIntervalSec || 8;
        syncShowCheckboxes(d);
        renderPaletteSwatches();
      }

      function newElId(type) {
        return type + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
      }

      function defaultSlot(type) {
        const w = TABLET.width;
        const h = TABLET.height;
        const map = {
          logo: { x: Math.round(w * 0.25), y: 12, w: Math.round(w * 0.5), h: Math.max(48, Math.round(h * 0.12)) },
          title: { x: 24, y: Math.round(h * 0.16), w: w - 48, h: Math.max(36, Math.round(h * 0.1)) },
          status: { x: 24, y: Math.round(h * 0.28), w: w - 48, h: Math.max(56, Math.round(h * 0.16)) },
          slideshow: { x: 24, y: Math.round(h * 0.28), w: w - 48, h: Math.round(h * 0.35) },
          hours: { x: 24, y: Math.round(h * 0.48), w: w - 48, h: Math.max(120, h - Math.round(h * 0.48) - 16) },
          text: { x: 40, y: 40, w: Math.min(480, w - 80), h: 56, text: 'New text', fontSize: 28, color: '', align: 'center', bold: true },
          image: { x: 40, y: Math.round(h * 0.35), w: w - 80, h: Math.round(h * 0.4), mediaId: '', fit: 'cover' },
          sketch: {
            x: Math.round(w * 0.1),
            y: Math.round(h * 0.55),
            w: Math.round(w * 0.8),
            h: Math.round(h * 0.35),
            dataUrl: '',
            penColor: '#000000',
            penSize: 3
          }
        };
        const base = map[type] || map.text;
        return Object.assign({ id: newElId(type), type }, base);
      }

      function ensureLayout(c) {
        if (!c.design) c.design = defaultDesign();
        if (!Array.isArray(c.design.layout)) c.design.layout = defaultDesign().layout.slice();
        return c.design.layout;
      }

      function addLayoutElement(type, extras) {
        const c = selected();
        if (!c) return;
        const layout = ensureLayout(c);
        const singleton = ['logo', 'title', 'status', 'hours', 'slideshow'].includes(type);
        if (singleton) {
          const existing = layout.find((e) => e.type === type);
          if (existing) {
            selectedElId = existing.id;
            syncShowCheckboxes(c.design);
            renderCanvas();
            return;
          }
        }
        const el = Object.assign(defaultSlot(type), extras || {});
        if (type === 'image' && !el.mediaId) {
          const first = (c.media || [])[0];
          if (first) el.mediaId = first.id;
        }
        layout.push(el);
        selectedElId = el.id;
        syncShowCheckboxes(c.design);
        renderCanvas();
      }

      function removeLayoutType(type) {
        const c = selected();
        if (!c) return;
        const layout = ensureLayout(c);
        c.design.layout = layout.filter((e) => e.type !== type);
        if (selectedElId && !c.design.layout.some((e) => e.id === selectedElId)) selectedElId = null;
        syncShowCheckboxes(c.design);
        renderCanvas();
      }

      function deleteSelectedElement() {
        const c = selected();
        if (!c || !selectedElId) {
          setStatus('Select an element on the canvas first.', true);
          return;
        }
        const layout = ensureLayout(c);
        c.design.layout = layout.filter((e) => e.id !== selectedElId);
        selectedElId = null;
        syncShowCheckboxes(c.design);
        renderCanvas();
        setStatus('Element deleted. Save to keep the change.');
      }

      function selectedLayoutEl() {
        const c = selected();
        if (!c || !selectedElId) return null;
        return (c.design.layout || []).find((e) => e.id === selectedElId) || null;
      }

      function fillElMediaSelect(customer, selectedMediaId) {
        const sel = document.getElementById('elMediaSelect');
        const media = (customer && customer.media) || [];
        sel.innerHTML = ['<option value="">— pick gallery image —</option>']
          .concat(media.map((m) => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name || m.id)}</option>`))
          .join('');
        sel.value = selectedMediaId || '';
      }

      function syncElPropsPanel() {
        const props = document.getElementById('elProps');
        const textProps = document.getElementById('elTextProps');
        const imgProps = document.getElementById('elImageProps');
        const sketchProps = document.getElementById('elSketchProps');
        const el = selectedLayoutEl();
        const c = selected();
        if (!el || (el.type !== 'text' && el.type !== 'image' && el.type !== 'sketch')) {
          props.classList.add('hidden-block');
          return;
        }
        props.classList.remove('hidden-block');
        suppressPropsSync = true;
        textProps.classList.add('hidden-block');
        imgProps.classList.add('hidden-block');
        sketchProps.classList.add('hidden-block');
        if (el.type === 'text') {
          textProps.classList.remove('hidden-block');
          document.getElementById('elText').value = el.text || '';
          document.getElementById('elFontSize').value = el.fontSize || 28;
          document.getElementById('elAlign').value = el.align || 'center';
          const color = el.color || (c && c.design && c.design.textColor) || '#f6f8ff';
          document.getElementById('elColor').value = /^#/.test(color) ? color : '#f6f8ff';
        } else if (el.type === 'image') {
          imgProps.classList.remove('hidden-block');
          fillElMediaSelect(c, el.mediaId || '');
          document.getElementById('elFit').value = el.fit === 'contain' ? 'contain' : 'cover';
        } else if (el.type === 'sketch') {
          sketchProps.classList.remove('hidden-block');
          document.getElementById('sketchPenColor').value = nearestPalette(el.penColor || '#000000');
          document.getElementById('sketchPenSize').value = el.penSize || 3;
          document.getElementById('sketchDrawBtn').classList.toggle('active', sketchMode === 'draw');
          document.getElementById('sketchMoveBtn').classList.toggle('active', sketchMode === 'move');
        }
        suppressPropsSync = false;
      }

      function bindColorPair(textId, pickId) {
        const text = document.getElementById(textId);
        const pick = document.getElementById(pickId);
        const which = textId === 'bgColor' ? 'bg' : textId === 'textColor' ? 'text' : 'accent';
        pick.addEventListener('input', () => {
          setColorField(which, pick.value);
          renderCanvas();
        });
        text.addEventListener('change', () => {
          setColorField(which, text.value);
          renderCanvas();
        });
      }

      function renderCanvas() {
        const c = selected();
        if (!c) return;
        ensureLayout(c);
        // Migrate legacy: hide via show* by removing from layout once when loading older saves
        if (c.design._legacyShowApplied !== true && typeof c.design.showSlideshow === 'boolean') {
          const d = c.design;
          if (d.showLogo === false) d.layout = d.layout.filter((e) => e.type !== 'logo');
          if (d.showTitle === false) d.layout = d.layout.filter((e) => e.type !== 'title');
          if (d.showStatus === false) d.layout = d.layout.filter((e) => e.type !== 'status');
          if (d.showHours === false) d.layout = d.layout.filter((e) => e.type !== 'hours');
          if (d.showSlideshow === false) d.layout = d.layout.filter((e) => e.type !== 'slideshow');
          d._legacyShowApplied = true;
        }
        const design = readDesignFromForm(c.design);
        design.layout = c.design.layout;
        c.design = Object.assign(c.design, design);
        syncShowCheckboxes(c.design);
        const hours = c.useManualHours || !c.googleHours ? (c.hours || defaultHours()) : c.googleHours;
        const logoSrc = logoDataUrl || design.logoUrl || '';
        const mediaById = new Map((c.media || []).map((m) => [m.id, m]));
        const openMedia = design.openMediaId ? mediaById.get(design.openMediaId) : null;
        const closedMedia = design.closedMediaId ? mediaById.get(design.closedMediaId) : null;
        const slideItems = (design.slideshowMediaIds || []).map((id) => mediaById.get(id)).filter(Boolean);

        tabletFrame.style.background = design.backgroundColor;
        tabletFrame.style.color = design.textColor;
        tabletFrame.style.fontFamily = design.fontFamily;
        const stage = tabletFrame.parentElement;
        if (stage) stage.style.background = design.backgroundColor || '#FFFFFF';
        tabletFrame.innerHTML = '';

        design.layout.forEach((el) => {
          const node = document.createElement('div');
          node.className = 'canvas-el' + (el.id === selectedElId ? ' selected' : '');
          node.dataset.type = el.type;
          node.dataset.id = el.id;
          node.style.left = el.x + 'px';
          node.style.top = el.y + 'px';
          node.style.width = el.w + 'px';
          node.style.height = el.h + 'px';

          if (el.type === 'logo') {
            node.innerHTML = logoSrc
              ? `<img class="preview-logo" src="${logoSrc}" alt="Logo">`
              : `<div style="height:100%;display:grid;place-items:center;opacity:.5;border:1px dashed ${design.accentColor}">Logo</div>`;
          } else if (el.type === 'title') {
            node.innerHTML = `<div class="preview-title" style="font-size:${design.titleFontSize}px;color:${design.textColor}">${escapeHtml(c.name)}</div>`;
          } else if (el.type === 'status') {
            const openNow = isOpenNow(hours);
            if (design.statusMode === 'image' && (openMedia || closedMedia)) {
              const preview = openNow ? (openMedia || closedMedia) : (closedMedia || openMedia);
              node.innerHTML = `<img class="preview-slide" src="${escapeHtml(mediaUrl(c, preview))}" alt="${openNow ? 'Open' : 'Closed'}">`;
            } else if (design.statusMode === 'text') {
              node.innerHTML = `<div class="preview-status" style="font-size:${Math.min(design.statusFontSize, 28)}px;color:${openNow ? design.accentColor : design.textColor}">${openNow ? 'Open Now' : 'Closed Now'}</div>`;
            } else {
              node.innerHTML = `<div class="preview-badge" style="font-size:${design.statusFontSize}px;background:${openNow ? design.accentColor : '#000000'};color:${openNow ? '#04120e' : '#FFFFFF'}">${openNow ? 'OPEN' : 'CLOSED'}</div>`;
            }
          } else if (el.type === 'slideshow') {
            if (slideItems.length) {
              node.innerHTML = `<img class="preview-slide" src="${escapeHtml(mediaUrl(c, slideItems[0]))}" alt="Slideshow">`;
            } else {
              node.innerHTML = `<div style="height:100%;display:grid;place-items:center;opacity:.55;border:1px dashed ${design.accentColor}">Slideshow images</div>`;
            }
          } else if (el.type === 'hours') {
            node.innerHTML = `<div class="preview-hours" style="font-size:${design.hoursFontSize}px">${
              DAYS.map((day) => `<div class="row"><span>${DAY_LABELS[day]}</span><span style="color:${design.accentColor}">${escapeHtml(formatDay(hours[day]))}</span></div>`).join('')
            }</div>`;
          } else if (el.type === 'text') {
            const color = el.color || design.textColor;
            node.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:${el.align === 'left' ? 'flex-start' : el.align === 'right' ? 'flex-end' : 'center'};font-size:${el.fontSize || 28}px;color:${color};font-weight:${el.bold === false ? 400 : 700};text-align:${el.align || 'center'};line-height:1.2;padding:4px;overflow:hidden;white-space:pre-wrap;word-break:break-word;">${escapeHtml(el.text || 'Text')}</div>`;
          } else if (el.type === 'image') {
            const media = el.mediaId ? mediaById.get(el.mediaId) : null;
            if (media) {
              node.innerHTML = `<img class="preview-slide" style="object-fit:${el.fit === 'contain' ? 'contain' : 'cover'}" src="${escapeHtml(mediaUrl(c, media))}" alt="">`;
            } else {
              node.innerHTML = `<div style="height:100%;display:grid;place-items:center;opacity:.55;border:1px dashed ${design.accentColor}">Pick image</div>`;
            }
          } else if (el.type === 'sketch') {
            if (el.dataUrl) {
              node.innerHTML = `<img class="preview-sketch" src="${escapeHtml(el.dataUrl)}" alt="Sketch">`;
            } else {
              node.innerHTML = `<div class="preview-sketch-empty">Sketch — tap Draw & write</div>`;
            }
            if (el.id === selectedElId && sketchMode === 'draw') node.classList.add('sketching');
          }

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'del-x';
          del.title = 'Delete';
          del.textContent = '×';
          del.addEventListener('pointerdown', (event) => {
            event.stopPropagation();
            event.preventDefault();
            selectedElId = el.id;
            deleteSelectedElement();
          });
          node.appendChild(del);

          const handle = document.createElement('div');
          handle.className = 'handle';
          node.appendChild(handle);
          tabletFrame.appendChild(node);

          node.addEventListener('pointerdown', (event) => {
            if (event.target === del || event.target.closest('.del-x')) return;
            selectedElId = el.id;
            syncElPropsPanel();
            if (event.target === handle) {
              dragState = { mode: 'resize', id: el.id, startX: event.clientX, startY: event.clientY, startW: el.w, startH: el.h };
              node.classList.add('dragging', 'selected');
              node.setPointerCapture(event.pointerId);
              return;
            }
            if (el.type === 'sketch' && sketchMode === 'draw') {
              const rect = node.getBoundingClientRect();
              const scaleX = el.w / Math.max(1, rect.width);
              const scaleY = el.h / Math.max(1, rect.height);
              const x = (event.clientX - rect.left) * scaleX;
              const y = (event.clientY - rect.top) * scaleY;
              const penColor = nearestPalette(el.penColor || document.getElementById('sketchPenColor').value || '#000000');
              const penSize = Math.max(1, Math.min(24, Number(el.penSize || document.getElementById('sketchPenSize').value) || 3));
              el.penColor = penColor;
              el.penSize = penSize;
              dragState = {
                mode: 'sketch',
                id: el.id,
                canvas: document.createElement('canvas'),
                lastX: x,
                lastY: y,
                penColor,
                penSize
              };
              const canvas = dragState.canvas;
              canvas.width = Math.max(1, Math.round(el.w));
              canvas.height = Math.max(1, Math.round(el.h));
              const ctx = canvas.getContext('2d');
              const finishStart = () => {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = penColor;
                ctx.lineWidth = penSize;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 0.01, y + 0.01);
                ctx.stroke();
                node.classList.add('sketching', 'selected');
                node.setPointerCapture(event.pointerId);
              };
              if (el.dataUrl) {
                const img = new Image();
                img.onload = () => {
                  ctx.clearRect(0, 0, canvas.width, canvas.height);
                  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                  finishStart();
                };
                img.onerror = finishStart;
                img.src = el.dataUrl;
              } else {
                finishStart();
              }
              return;
            }
            dragState = { mode: 'move', id: el.id, startX: event.clientX, startY: event.clientY, startLeft: el.x, startTop: el.y };
            node.classList.add('dragging', 'selected');
            node.setPointerCapture(event.pointerId);
          });
        });
        syncElPropsPanel();
        scaleTablet();
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderList() {
        if (!customers.length) {
          customerList.innerHTML = '<p class="hint">No customers yet. Click New Customer.</p>';
          return;
        }
        customerList.innerHTML = customers.map((c) => `
          <button type="button" class="customer-item ${c.id === selectedId ? 'active' : ''}" data-id="${escapeHtml(c.id)}">
            <strong>${escapeHtml(c.name || 'Untitled')}</strong>
            <span>/SmartHours/v/${escapeHtml(c.slug || '…')}</span>
          </button>
        `).join('');
      }

      function fillEditor(customer) {
        editor.classList.add('open');
        selectedElId = null;
        document.getElementById('fieldName').value = customer.name || '';
        document.getElementById('fieldSlug').value = customer.slug || '';
        const slugEl = document.getElementById('fieldSlug');
        if (customer.slug) slugEl.dataset.touched = '1';
        else delete slugEl.dataset.touched;
        document.getElementById('fieldMapsUrl').value = customer.googleMapsUrl || customer.googlePlaceId || '';
        document.getElementById('fieldManual').checked = !!customer.useManualHours;
        const hoursForForm =
          customer.useManualHours || !customer.googleHours
            ? customer.hours || defaultHours()
            : customer.googleHours;
        renderHoursForm(hoursForForm);
        writeDesignToForm(customer.design);
        writeEinkToForm(customer.eink);
        renderGallery(customer);
        logoDataUrl = null;
        document.getElementById('logoFile').value = '';
        if (customer.lastSyncedAt) {
          document.getElementById('syncMeta').textContent =
            'Last sync: ' + new Date(customer.lastSyncedAt).toLocaleString() +
            (customer.googleDisplayName ? ` · Google: ${customer.googleDisplayName}` : '') +
            (customer.lastSyncNote ? ` · ${customer.lastSyncNote}` : '');
        } else if (customer.lastSyncError) {
          document.getElementById('syncMeta').textContent = 'Last sync failed: ' + customer.lastSyncError;
        } else {
          document.getElementById('syncMeta').textContent = '';
        }
        renderCanvas();
        if (customer && !String(customer.id).startsWith('tmp-')) showDesignEinkPreview(customer);
        else showDesignEinkPreview(null);
      }

      async function loadCustomers() {
        setStatus('Loading…', false, true);
        const res = await apiFetch('/api/smarthours/customers');
        if (!res.ok) throw new Error('Failed to load customers');
        const data = await res.json();
        customers = data.customers || [];
        settings = data.settings || settings;
        const autoEl = document.getElementById('autoSyncHours');
        if (autoEl) autoEl.value = String(settings.autoSyncIntervalHours ?? 24);
        renderList();
        if (selectedId) {
          const c = selected();
          if (c) fillEditor(c);
          else {
            selectedId = null;
            editor.classList.remove('open');
          }
        }
        setStatus(
          data.googlePlacesApiConfigured
            ? ''
            : 'Sync uses Google Places when PLACES_API is set, otherwise share.google / Maps page scrape.'
        );
      }

      function collectPayload() {
        const c = selected();
        const design = readDesignFromForm(c ? c.design : defaultDesign());
        if (c && c.design && c.design.layout) design.layout = c.design.layout;
        if (c && c.design && c.design.logoUrl && !logoDataUrl) design.logoUrl = c.design.logoUrl;
        delete design._legacyShowApplied;
        const googleRef = document.getElementById('fieldMapsUrl').value.trim();
        const looksLikePlaceId = /^ChIJ[\w-]+$/i.test(googleRef) || /^places\/ChIJ/i.test(googleRef);
        const payload = {
          name: document.getElementById('fieldName').value.trim(),
          slug: document.getElementById('fieldSlug').value.trim(),
          googlePlaceId: looksLikePlaceId ? googleRef.replace(/^places\//i, '') : (c && c.googlePlaceId) || '',
          googleMapsUrl: looksLikePlaceId ? '' : googleRef,
          useManualHours: document.getElementById('fieldManual').checked,
          hours: readHoursFromForm(),
          design,
          eink: {
            enabled: true,
            pollIntervalMinutes: Number(document.getElementById('einkPoll').value) || 720,
            width: Number(document.getElementById('einkWidth').value) || 800,
            height: Number(document.getElementById('einkHeight').value) || 480,
            orientation: document.getElementById('einkOrientation').value === 'portrait' ? 'portrait' : 'landscape',
            colorMode: resolveColorMode(document.getElementById('einkColorMode').value),
            inverted: document.getElementById('einkInverted').checked
          }
        };
        if (logoDataUrl) payload.logoDataUrl = logoDataUrl;
        return payload;
      }

      function writeEinkToForm(eink) {
        const e = eink || {};
        document.getElementById('einkPoll').value = e.pollIntervalMinutes || 720;
        document.getElementById('einkWidth').value = e.width || 800;
        document.getElementById('einkHeight').value = e.height || 480;
        document.getElementById('einkOrientation').value = e.orientation === 'portrait' ? 'portrait' : 'landscape';
        document.getElementById('einkColorMode').value = resolveColorMode(e.colorMode);
        document.getElementById('einkInverted').checked = !!e.inverted;
        syncScreenFields(false);
        if (!document.getElementById('espBaseUrl').value) {
          document.getElementById('espBaseUrl').value = location.origin;
        }
      }

      function displayPngUrl(customer, bust) {
        const base = (document.getElementById('espBaseUrl').value || location.origin).replace(/\/$/, '');
        return `${base}/api/smarthours/public/${encodeURIComponent(customer.slug)}/display.png?t=${bust || Date.now()}`;
      }

      function showDesignEinkPreview(customer) {
        const wrap = document.getElementById('designEinkPreviewWrap');
        const img = document.getElementById('designEinkPreview');
        if (!customer || String(customer.id).startsWith('tmp-')) {
          wrap.classList.add('hidden-block');
          img.removeAttribute('src');
          return;
        }
        wrap.classList.remove('hidden-block');
        img.src = displayPngUrl(customer);
      }

      function refreshEinkPanel() {
        const c = selected();
        if (!c || String(c.id).startsWith('tmp-')) {
          document.getElementById('einkUrlBox').textContent = 'Save the customer first to enable display URLs.';
          document.getElementById('einkPreview').removeAttribute('src');
          document.getElementById('espSketch').value = '';
          showDesignEinkPreview(null);
          return;
        }
        const base = (document.getElementById('espBaseUrl').value || location.origin).replace(/\/$/, '');
        const htmlUrl = `${base}/SmartHours/v/${encodeURIComponent(c.slug)}`;
        const pngUrl = displayPngUrl(c);
        document.getElementById('einkUrlBox').innerHTML =
          `<div><strong>HTML display:</strong> <a href="${htmlUrl}" target="_blank" rel="noopener">${htmlUrl}</a></div>` +
          `<div style="margin-top:6px"><strong>PNG image:</strong> <a href="${pngUrl}" target="_blank" rel="noopener">${base}/api/smarthours/public/${encodeURIComponent(c.slug)}/display.png</a></div>`;
        document.getElementById('einkPreview').src = pngUrl;
        showDesignEinkPreview(c);
        loadEspSketch().catch((err) => setStatus(err.message, true));
      }

      async function loadEspSketch() {
        const c = selected();
        if (!c || String(c.id).startsWith('tmp-')) return;
        const params = new URLSearchParams({
          baseUrl: (document.getElementById('espBaseUrl').value || location.origin).replace(/\/$/, ''),
          wifiSsid: document.getElementById('espWifiSsid').value || 'YOUR_WIFI_SSID',
          wifiPass: document.getElementById('espWifiPass').value || 'YOUR_WIFI_PASSWORD',
          pollIntervalMinutes: String(document.getElementById('einkPoll').value || 720)
        });
        const res = await apiFetch('/api/smarthours/customers/' + encodeURIComponent(c.id) + '/esp32-sketch?' + params.toString());
        if (!res.ok) throw new Error('Failed to generate ESP32 sketch');
        const ver = res.headers.get('X-SmartHours-Version') || '';
        const bytes = res.headers.get('X-SmartHours-Bmp-Bytes') || '';
        document.getElementById('espSketch').value = await res.text();
        const meta = document.getElementById('sketchMeta');
        if (meta) {
          meta.textContent = ver
            ? `Sketch includes embedded Design BMP · version ${ver}${bytes ? ` · ${bytes} bytes` : ''}`
            : '';
        }
      }

      async function saveCustomer(options) {
        const opts = options || {};
        const payload = collectPayload();
        if (opts.omitHours) delete payload.hours;
        if (!payload.name) {
          setStatus('Customer name is required.', true);
          return;
        }
        setStatus('Saving…');
        let res;
        if (selectedId && !String(selectedId).startsWith('tmp-')) {
          res = await apiFetch('/api/smarthours/customers/' + encodeURIComponent(selectedId), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } else {
          res = await apiFetch('/api/smarthours/customers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Save failed');
        selectedId = data.id;
        logoDataUrl = null;
        await loadCustomers();
        const hasGoogle = !!(payload.googleMapsUrl || payload.googlePlaceId);
        if (!opts.silent) {
          setStatus(
            hasGoogle && !payload.useManualHours
              ? 'Saved. Click Sync Google hours to pull opening times.'
              : 'Saved. Public URL ready.'
          );
        }
        return selected();
      }

      hoursBody.addEventListener('change', (event) => {
        const row = event.target.closest('tr[data-day]');
        if (!row || !event.target.matches('[data-f="closed"]')) return;
        syncHoursRowState(row);
      });

      document.getElementById('newCustomerBtn').addEventListener('click', () => {
        const temp = {
          id: 'tmp-' + Date.now(),
          name: '',
          slug: '',
          googlePlaceId: '',
          googleMapsUrl: '',
          useManualHours: false,
          hours: defaultHours(),
          design: defaultDesign(),
          lastSyncedAt: null
        };
        customers.unshift(temp);
        selectedId = temp.id;
        renderList();
        fillEditor(temp);
        document.getElementById('fieldName').focus();
        setStatus('Enter a customer name, paste a Maps place URL, then Save.');
      });

      customerList.addEventListener('click', (event) => {
        const btn = event.target.closest('[data-id]');
        if (!btn) return;
        const c = selected();
        if (c && String(selectedId).startsWith('tmp-')) {
          // keep unsaved edits only if still selected
        }
        selectedId = btn.dataset.id;
        const customer = selected();
        if (customer) {
          renderList();
          fillEditor(customer);
        }
      });

      document.querySelectorAll('.tabs [data-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tabs [data-tab]').forEach((b) => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
          if (btn.dataset.tab === 'design') {
            renderCanvas();
            scaleTablet();
          }
          if (btn.dataset.tab === 'esp32') refreshEinkPanel();
        });
      });

      document.getElementById('saveBtn').addEventListener('click', () => {
        saveCustomer().catch((err) => setStatus(err.message, true));
      });
      document.getElementById('saveDesignBtn').addEventListener('click', () => {
        saveCustomer()
          .then((c) => {
            if (!c) return;
            showDesignEinkPreview(c);
            setStatus('Design saved. High-res PNG preview updated below.');
          })
          .catch((err) => setStatus(err.message, true));
      });
      document.getElementById('saveEinkBtn').addEventListener('click', () => {
        saveCustomer()
          .then(() => {
            refreshEinkPanel();
            setStatus('E-ink settings saved. Preview refreshed.');
          })
          .catch((err) => setStatus(err.message, true));
      });
      document.getElementById('previewEinkBtn').addEventListener('click', () => refreshEinkPanel());
      document.getElementById('downloadSketchBtn').addEventListener('click', async () => {
        const c = selected();
        if (!c || String(c.id).startsWith('tmp-')) {
          setStatus('Save the customer first.', true);
          return;
        }
        await saveCustomer();
        const params = new URLSearchParams({
          baseUrl: (document.getElementById('espBaseUrl').value || location.origin).replace(/\/$/, ''),
          wifiSsid: document.getElementById('espWifiSsid').value || 'YOUR_WIFI_SSID',
          wifiPass: document.getElementById('espWifiPass').value || 'YOUR_WIFI_PASSWORD',
          pollIntervalMinutes: String(document.getElementById('einkPoll').value || 720)
        });
        const res = await apiFetch('/api/smarthours/customers/' + encodeURIComponent(c.id) + '/esp32-sketch?' + params.toString());
        if (!res.ok) throw new Error('Failed to download sketch');
        const ver = res.headers.get('X-SmartHours-Version') || '';
        const text = await res.text();
        document.getElementById('espSketch').value = text;
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `SmartHours_${c.slug}.ino`;
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus(ver
          ? `ESP32 sketch downloaded with Design canvas embedded (v${ver}).`
          : 'ESP32 sketch downloaded.');
        refreshEinkPanel();
      });
      document.getElementById('copySketchBtn').addEventListener('click', async () => {
        await loadEspSketch();
        const text = document.getElementById('espSketch').value;
        await navigator.clipboard.writeText(text);
        setStatus('Sketch copied to clipboard.');
      });
      ['espBaseUrl', 'espWifiSsid', 'espWifiPass', 'einkPoll'].forEach((id) => {
        document.getElementById(id).addEventListener('change', () => {
          if (document.getElementById('tab-esp32').classList.contains('active')) {
            loadEspSketch().catch(() => {});
          }
        });
      });

      document.getElementById('deleteBtn').addEventListener('click', async () => {
        const c = selected();
        if (!c) return;
        if (String(c.id).startsWith('tmp-')) {
          customers = customers.filter((x) => x.id !== c.id);
          selectedId = null;
          editor.classList.remove('open');
          renderList();
          return;
        }
        if (!confirm('Delete this customer and their public page?')) return;
        const res = await apiFetch('/api/smarthours/customers/' + encodeURIComponent(c.id), { method: 'DELETE' });
        if (!res.ok) {
          setStatus('Delete failed', true);
          return;
        }
        selectedId = null;
        editor.classList.remove('open');
        await loadCustomers();
        setStatus('Deleted.');
      });

      document.getElementById('syncOneBtn').addEventListener('click', async () => {
        const c = selected();
        const btn = document.getElementById('syncOneBtn');
        if (!c || String(c.id).startsWith('tmp-')) {
          setStatus('Save the customer first, then sync.', true);
          return;
        }
        try {
          if (document.getElementById('fieldManual').checked) {
            if (!confirm('Manual hours is on. Sync will still update stored Google hours, but the table stays manual until you uncheck it. Continue?')) {
              return;
            }
          }
          setBusy(btn, true, 'Syncing…');
          setStatus('Syncing Google hours…', false, true);
          await saveCustomer({ omitHours: true, silent: true });
          const id = selectedId;
          const res = await apiFetch('/api/smarthours/customers/' + encodeURIComponent(id) + '/sync', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          await loadCustomers();
          if (!res.ok) throw new Error(data.error || data.customer?.lastSyncError || 'Sync failed');
          const name = data.displayName || data.customer?.googleDisplayName || '';
          const note = data.syncNote || data.customer?.lastSyncNote || '';
          setStatus(
            (data.changed ? 'Google hours updated' : 'Synced — no hour changes') +
              (name ? ` (${name})` : '') +
              (note ? ` — ${note}` : '') +
              '.'
          );
          if (selected()) fillEditor(selected());
        } catch (err) {
          setStatus(err.message || 'Sync failed', true);
        } finally {
          setBusy(btn, false);
        }
      });

      document.getElementById('syncAllBtn').addEventListener('click', async () => {
        const btn = document.getElementById('syncAllBtn');
        try {
          setBusy(btn, true, 'Syncing…');
          setStatus('Syncing all customers…', false, true);
          const res = await apiFetch('/api/smarthours/sync-all', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Sync failed');
          await loadCustomers();
          setStatus(`Synced ${data.synced || 0} · changed ${data.changed || 0} · errors ${data.errors || 0}`);
        } catch (err) {
          setStatus(err.message || 'Sync failed', true);
        } finally {
          setBusy(btn, false);
        }
      });

      document.getElementById('saveAutoSyncBtn').addEventListener('click', async () => {
        const btn = document.getElementById('saveAutoSyncBtn');
        try {
          const hours = Number(document.getElementById('autoSyncHours').value);
          setBusy(btn, true, 'Saving…');
          const res = await apiFetch('/api/smarthours/settings', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ autoSyncIntervalHours: hours })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Failed to save sync interval');
          settings = data.settings || settings;
          document.getElementById('autoSyncHours').value = String(settings.autoSyncIntervalHours ?? 24);
          setStatus(
            settings.autoSyncIntervalHours > 0
              ? `Auto Google sync set to every ${settings.autoSyncIntervalHours} hour(s).`
              : 'Auto Google sync turned off.'
          );
        } catch (err) {
          setStatus(err.message || 'Failed to save sync interval', true);
        } finally {
          setBusy(btn, false);
        }
      });

      document.getElementById('logoFile').addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          logoDataUrl = String(reader.result || '');
          renderCanvas();
        };
        reader.readAsDataURL(file);
      });

      async function uploadGalleryFiles(fileList) {
        const c = selected();
        if (!c || String(c.id).startsWith('tmp-')) {
          setStatus('Save the customer first, then upload gallery images.', true);
          return;
        }
        const files = Array.from(fileList || []);
        if (!files.length) return;
        setStatus('Uploading images…');
        for (const file of files) {
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || ''));
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const res = await apiFetch('/api/smarthours/customers/' + encodeURIComponent(c.id) + '/media', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dataUrl, name: file.name })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Upload failed');
          c.media = data.media || c.media;
        }
        const latest = selected();
        if (latest) {
          latest.media = c.media;
          renderGallery(latest);
          renderCanvas();
        }
        setStatus('Gallery updated.');
      }

      document.getElementById('galleryFile').addEventListener('change', (event) => {
        uploadGalleryFiles(event.target.files)
          .catch((err) => setStatus(err.message, true))
          .finally(() => { event.target.value = ''; });
      });

      document.getElementById('galleryList').addEventListener('click', async (event) => {
        const del = event.target.closest('[data-del-media]');
        if (!del) return;
        const c = selected();
        if (!c || String(c.id).startsWith('tmp-')) return;
        if (!confirm('Delete this image?')) return;
        try {
          const res = await apiFetch(
            '/api/smarthours/customers/' + encodeURIComponent(c.id) + '/media/' + encodeURIComponent(del.dataset.delMedia),
            { method: 'DELETE' }
          );
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Delete failed');
          if (data.customer) {
            const idx = customers.findIndex((x) => x.id === c.id);
            if (idx >= 0) customers[idx] = { ...data.customer, media: data.media || data.customer.media };
          }
          fillEditor(selected());
          setStatus('Image deleted.');
        } catch (err) {
          setStatus(err.message || 'Delete failed', true);
        }
      });

      document.getElementById('galleryList').addEventListener('change', () => renderCanvas());

      document.getElementById('addTextBtn').addEventListener('click', () => addLayoutElement('text'));
      document.getElementById('addSketchBtn').addEventListener('click', () => {
        addLayoutElement('sketch');
        sketchMode = 'draw';
        syncElPropsPanel();
        setStatus('Sketch added — Draw mode on. Write on the box, then Save Design.');
      });
      document.getElementById('addImageBtn').addEventListener('click', () => {
        const c = selected();
        if (!c) return;
        if (!(c.media || []).length) {
          setStatus('Upload a gallery image first, then add it to the canvas.', true);
          return;
        }
        addLayoutElement('image');
      });
      document.getElementById('addHoursBtn').addEventListener('click', () => addLayoutElement('hours'));
      document.getElementById('addStatusBtn').addEventListener('click', () => addLayoutElement('status'));
      document.getElementById('addLogoBtn').addEventListener('click', () => addLayoutElement('logo'));
      document.getElementById('addTitleBtn').addEventListener('click', () => addLayoutElement('title'));
      document.getElementById('addSlideshowBtn').addEventListener('click', () => addLayoutElement('slideshow'));
      document.getElementById('deleteElBtn').addEventListener('click', () => deleteSelectedElement());

      document.getElementById('sketchDrawBtn').addEventListener('click', () => {
        sketchMode = 'draw';
        syncElPropsPanel();
        renderCanvas();
      });
      document.getElementById('sketchMoveBtn').addEventListener('click', () => {
        sketchMode = 'move';
        syncElPropsPanel();
        renderCanvas();
      });
      document.getElementById('sketchClearBtn').addEventListener('click', () => {
        const el = selectedLayoutEl();
        if (!el || el.type !== 'sketch') return;
        el.dataUrl = '';
        renderCanvas();
        setStatus('Sketch cleared.');
      });
      ['sketchPenColor', 'sketchPenSize'].forEach((id) => {
        const input = document.getElementById(id);
        if (!input) return;
        const apply = () => {
          if (suppressPropsSync) return;
          const el = selectedLayoutEl();
          if (!el || el.type !== 'sketch') return;
          el.penColor = nearestPalette(document.getElementById('sketchPenColor').value || '#000000');
          el.penSize = Math.max(1, Math.min(24, Number(document.getElementById('sketchPenSize').value) || 3));
          document.getElementById('sketchPenColor').value = el.penColor;
        };
        input.addEventListener('input', apply);
        input.addEventListener('change', apply);
      });

      ['elText', 'elFontSize', 'elAlign', 'elColor', 'elMediaSelect', 'elFit'].forEach((id) => {
        const input = document.getElementById(id);
        if (!input) return;
        const handler = () => {
          if (suppressPropsSync) return;
          const el = selectedLayoutEl();
          if (!el) return;
          if (el.type === 'text') {
            el.text = document.getElementById('elText').value.slice(0, 500);
            el.fontSize = Math.max(10, Math.min(120, Number(document.getElementById('elFontSize').value) || 28));
            el.align = document.getElementById('elAlign').value || 'center';
            el.color = document.getElementById('elColor').value || '';
          } else if (el.type === 'image') {
            el.mediaId = document.getElementById('elMediaSelect').value || '';
            el.fit = document.getElementById('elFit').value === 'contain' ? 'contain' : 'cover';
          }
          renderCanvas();
        };
        input.addEventListener('input', handler);
        input.addEventListener('change', handler);
      });

      const showTypeMap = {
        showLogo: 'logo',
        showTitle: 'title',
        showStatus: 'status',
        showHours: 'hours',
        showSlideshow: 'slideshow'
      };
      Object.keys(showTypeMap).forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('change', () => {
          if (el.checked) addLayoutElement(showTypeMap[id]);
          else removeLayoutType(showTypeMap[id]);
        });
      });

      ['titleSize','hoursSize','statusSize','fontFamily','fieldName','statusMode','openMediaSelect','closedMediaSelect','slideshowInterval'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', () => {
          const c = selected();
          if (c && id === 'fieldName') {
            c.name = el.value;
            const slugEl = document.getElementById('fieldSlug');
            if (slugEl && !slugEl.dataset.touched) {
              const slug = String(el.value || '')
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 64);
              slugEl.value = slug;
              c.slug = slug;
            }
            renderList();
          }
          renderCanvas();
        });
        el.addEventListener('change', () => renderCanvas());
      });

      document.getElementById('fieldSlug').addEventListener('input', () => {
        document.getElementById('fieldSlug').dataset.touched = '1';
        const c = selected();
        if (c) c.slug = document.getElementById('fieldSlug').value.trim();
        renderList();
      });

      bindColorPair('bgColor', 'bgColorPick');
      bindColorPair('textColor', 'textColorPick');
      bindColorPair('accentColor', 'accentColorPick');

      document.querySelectorAll('[data-palette-for]').forEach((wrap) => {
        wrap.addEventListener('click', (event) => {
          const btn = event.target.closest('.palette-swatch');
          if (!btn) return;
          setColorField(btn.getAttribute('data-which'), btn.getAttribute('data-color'));
          renderCanvas();
        });
      });

      document.getElementById('screenOrientation').addEventListener('change', () => {
        applyOrientationDefaults(document.getElementById('screenOrientation').value);
        renderCanvas();
      });
      document.getElementById('einkOrientation').addEventListener('change', () => {
        document.getElementById('screenOrientation').value = document.getElementById('einkOrientation').value;
        applyOrientationDefaults(document.getElementById('einkOrientation').value);
        renderCanvas();
      });
      document.getElementById('screenColorMode').addEventListener('change', () => {
        syncScreenFields(true);
        setColorField('bg', document.getElementById('bgColor').value);
        setColorField('text', document.getElementById('textColor').value);
        setColorField('accent', document.getElementById('accentColor').value);
        renderCanvas();
      });
      document.getElementById('einkColorMode').addEventListener('change', () => {
        syncScreenFields(false);
        setColorField('bg', document.getElementById('bgColor').value);
        setColorField('text', document.getElementById('textColor').value);
        setColorField('accent', document.getElementById('accentColor').value);
        renderCanvas();
      });
      ['einkWidthDesign', 'einkHeightDesign'].forEach((id) => {
        const el = document.getElementById(id);
        el.addEventListener('change', () => {
          syncScreenFields(true);
          renderCanvas();
        });
        el.addEventListener('input', () => {
          applyTabletSize(
            document.getElementById('einkWidthDesign').value,
            document.getElementById('einkHeightDesign').value
          );
        });
      });
      ['einkWidth', 'einkHeight'].forEach((id) => {
        document.getElementById(id).addEventListener('change', () => {
          syncScreenFields(false);
          renderCanvas();
        });
      });

      // Snap free color typing to the active palette
      ['bgColor', 'textColor', 'accentColor'].forEach((id) => {
        const which = id === 'bgColor' ? 'bg' : id === 'textColor' ? 'text' : 'accent';
        document.getElementById(id).addEventListener('change', () => {
          setColorField(which, document.getElementById(id).value);
          renderCanvas();
        });
      });
      renderPaletteSwatches();
      applyTabletSize(800, 480);

      // Keep canvas OPEN/CLOSED badge in sync with the clock
      setInterval(() => {
        if (!selected()) return;
        if (!document.querySelector('.tabs [data-tab="design"].active')) return;
        if (dragState && dragState.mode === 'sketch') return;
        renderCanvas();
      }, 30 * 1000);

      window.addEventListener('pointermove', (event) => {
        if (!dragState) return;
        const c = selected();
        if (!c || !c.design || !c.design.layout) return;
        const el = c.design.layout.find((x) => x.id === dragState.id);
        if (!el) return;
        if (dragState.mode === 'sketch') {
          const node = tabletFrame.querySelector('.canvas-el[data-id="' + String(el.id).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"]');
          if (!node || !dragState.canvas) return;
          const rect = node.getBoundingClientRect();
          const scaleX = el.w / Math.max(1, rect.width);
          const scaleY = el.h / Math.max(1, rect.height);
          const x = (event.clientX - rect.left) * scaleX;
          const y = (event.clientY - rect.top) * scaleY;
          const ctx = dragState.canvas.getContext('2d');
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = dragState.penColor || '#000000';
          ctx.lineWidth = dragState.penSize || 3;
          ctx.beginPath();
          ctx.moveTo(dragState.lastX, dragState.lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
          dragState.lastX = x;
          dragState.lastY = y;
          const img = node.querySelector('img.preview-sketch');
          const empty = node.querySelector('.preview-sketch-empty');
          if (empty) empty.remove();
          if (img) {
            img.src = dragState.canvas.toDataURL('image/png');
          } else {
            const fresh = document.createElement('img');
            fresh.className = 'preview-sketch';
            fresh.alt = 'Sketch';
            fresh.src = dragState.canvas.toDataURL('image/png');
            node.insertBefore(fresh, node.firstChild);
          }
          return;
        }
        const scale = Number((tabletFrame.style.transform.match(/scale\(([^)]+)\)/) || [])[1] || 1);
        const dx = (event.clientX - dragState.startX) / scale;
        const dy = (event.clientY - dragState.startY) / scale;
        if (dragState.mode === 'move') {
          el.x = Math.max(0, Math.min(TABLET.width - el.w, Math.round(dragState.startLeft + dx)));
          el.y = Math.max(0, Math.min(TABLET.height - el.h, Math.round(dragState.startTop + dy)));
        } else {
          el.w = Math.max(20, Math.min(TABLET.width - el.x, Math.round(dragState.startW + dx)));
          el.h = Math.max(16, Math.min(TABLET.height - el.y, Math.round(dragState.startH + dy)));
        }
        renderCanvas();
      });
      window.addEventListener('pointerup', () => {
        if (dragState && dragState.mode === 'sketch') {
          const c = selected();
          const el = c && c.design && c.design.layout
            ? c.design.layout.find((x) => x.id === dragState.id)
            : null;
          if (el && dragState.canvas) {
            el.dataUrl = dragState.canvas.toDataURL('image/png');
          }
        }
        dragState = null;
      });
      window.addEventListener('keydown', (event) => {
        if ((event.key === 'Delete' || event.key === 'Backspace') && selectedElId) {
          const tag = (event.target && event.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          event.preventDefault();
          deleteSelectedElement();
        }
      });
      window.addEventListener('resize', scaleTablet);

      loadCustomers().catch((err) => setStatus(err.message, true));
    })();
  </script>
</body>
</html>
