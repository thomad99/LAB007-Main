<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Elite Tasks">
  <title>Elite Task Manager | Elite Cleaning Services</title>
  <link rel="icon" href="/elite-cleaning-assets/elite-cleaning-favicon-32.png">
  <style>
    :root { color-scheme: light; --ink:#1c1917; --muted:#57534e; --line:#e7e5e4; --green:#0f6e56; --bg:#f3f4f6; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.35; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    body.login, body.mode-cleaner { padding-bottom: 24px; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #99d5c5; outline-offset: 2px; }
    .wrap { width: min(1120px, 100%); margin: 0 auto; padding: 18px 16px 28px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .refresh { width: 44px; height: 44px; border: 1px solid #d6d3d1; border-radius: 14px; background: #fff; color: var(--ink); display: grid; place-items: center; padding: 0; flex: 0 0 auto; }
    .refresh svg { width: 22px; height: 22px; }
    .refresh.spin svg { animation: refresh-spin .7s linear; }
    @keyframes refresh-spin { to { transform: rotate(360deg); } }
    .eyebrow { margin: 0; color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    h1 { margin: 2px 0 0; font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.1; }
    h2 { margin: 0; font-size: 1.25rem; }
    .who { margin: 4px 0 0; color: var(--muted); }
    #gate { min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
    .login-card, .panel, .day, .staff-card, .prop-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; }
    .login-card { width: min(440px, 100%); padding: 28px 22px; box-shadow: 0 16px 50px rgba(28,25,23,.08); }
    .login-card p { color: var(--muted); }
    label { display: block; font-weight: 750; font-size: 14px; margin: 14px 0 6px; }
    input[type="text"], input[type="password"], input[type="search"], input[type="date"], input[type="time"], input[type="number"], textarea, select {
      width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid #d6d3d1; padding: 10px 12px; background: #fff; font-size: 16px;
    }
    textarea { min-height: 120px; resize: vertical; }
    .btn { min-height: 48px; border-radius: 14px; border: 1px solid transparent; padding: 12px 14px; font-weight: 750; background: #fff; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; }
    .btn.primary { background: var(--green); color: #fff; }
    .btn.ghost { border-color: #d6d3d1; }
    .btn.blue { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .btn.danger { color: #b91c1c; border-color: #fecaca; }
    .btn.block { width: 100%; }
    .btn.small { min-height: 42px; padding: 8px 10px; }
    .error { color: #b91c1c; font-weight: 750; }
    .hint { color: var(--muted); font-weight: 500; font-size: 14px; }
    .pre { white-space: pre-wrap; }
    .tabs { display: none; gap: 8px; margin: 14px 0; }
    .weekbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0; }
    .week-title { display: flex; flex-direction: column; gap: 2px; }
    .week-title strong { font-size: 1.35rem; }
    .week-nav { display: flex; align-items: center; gap: 8px; }
    .week-nav .btn { min-height: 40px; min-width: 44px; padding: 8px 12px; }
    .week-nav .icon-btn { min-width: 48px; padding: 8px; }
    .week-nav svg { width: 22px; height: 22px; display: block; }
    .week-nav .btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    body.mode-manager .weekbar { flex-direction: column; align-items: center; justify-content: center; }
    body.mode-manager .week-nav { justify-content: center; flex-wrap: wrap; }
    body.mode-manager .week-title { align-items: center; text-align: center; }
    body.mode-manager .week-arrow { min-height: 44px; min-width: 48px; }
    body.mode-manager .filters { justify-content: center; }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .chip { flex: 0 0 auto; min-height: 40px; border-radius: 999px; border: 1px solid #d6d3d1; background: #fff; padding: 8px 12px; font-weight: 750; }
    .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .gcal { background: #fff; border: 1px solid #dadce0; border-radius: 12px; overflow: auto; max-height: calc(100dvh - 250px); min-height: 460px; }
    .gcal-head, .gcal-body { display: grid; grid-template-columns: 56px repeat(var(--day-count, 28), var(--day-col, 140px)); width: max-content; }
    .gcal-head { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #dadce0; }
    .gcal-time { position: sticky; left: 0; z-index: 4; background: #fff; }
    .gcal-head .gcal-time { z-index: 6; }
    .gcal-dayhead { position: relative; text-align: center; padding: 8px 18px 6px 4px; }
    .gcal-dow { display: block; color: #70757a; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .gcal-dom { width: 32px; height: 32px; margin: 2px auto 0; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 500; }
    .gcal-dayhead.today .gcal-dow, .gcal-dayhead.today .gcal-dom { color: var(--green); }
    .gcal-dom.today { background: var(--green); color: #fff !important; font-weight: 700; }
    .gcal-plus { position: absolute; top: 8px; right: 4px; width: 22px; height: 22px; border: 1px solid #dadce0; border-radius: 50%; background: #fff; color: var(--green); font-weight: 800; line-height: 1; padding: 0; }
    .gcal-hour { height: var(--hour-px, 52px); }
    .gcal-hour span { position: relative; top: -8px; display: block; text-align: right; padding-right: 8px; color: #70757a; font-size: 11px; }
    .gcal-hour:first-child span { top: 4px; }
    .gcal-col { position: relative; border-left: 1px solid #e8eaed; background-image: linear-gradient(to bottom, transparent calc(var(--hour-px, 52px) - 1px), #e8eaed var(--hour-px, 52px)); background-size: 100% var(--hour-px, 52px); }
    .gcal-col.today { background-color: #f6fbf9; }
    .gcal-event { position: absolute; overflow: hidden; border: 0; border-radius: 4px; padding: 3px 5px; text-align: left; line-height: 1.15; font-size: 12px; font-weight: 650; box-shadow: inset 0 0 0 1px rgba(255,255,255,.7); z-index: 1; }
    .gcal-event.scheduled { background: #fecaca; color: #7f1d1d; }
    .gcal-event.acknowledged { background: #bbf7d0; color: #14532d; }
    .gcal-event.completed { background: #166534; color: #f0fdf4; }
    .gcal-event strong, .gcal-event span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gcal-event strong { font-size: 11px; }
    .gcal-now { position: absolute; left: 0; right: 0; height: 2px; background: #ea4335; z-index: 2; pointer-events: none; }
    .gcal-now::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ea4335; }
    .jobs { display: flex; flex-direction: column; gap: 8px; }
    .job { background: #fff; border: 1px solid var(--line); border-left-width: 6px; border-radius: 16px; overflow: hidden; }
    .job.scheduled { border-left-color: #ea580c; }
    .job.acknowledged { border-left-color: #2563eb; }
    .job.completed { border-left-color: #059669; background: #f8faf9; }
    .job-main { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 12px 12px 8px; }
    .job-time { display: block; font-weight: 800; }
    .job-place { display: block; margin-top: 2px; }
    .job-addr, .job-flag { display: block; color: var(--muted); font-size: 14px; }
    .job-flag { color: #9a3412; font-weight: 750; }
    .job-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
    .pill { display: inline-flex; align-items: center; min-height: 26px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .pill.scheduled { background: #fecaca; color: #7f1d1d; }
    .pill.acknowledged { background: #bbf7d0; color: #14532d; }
    .pill.completed { background: #166534; color: #f0fdf4; }
    .job-actions { display: flex; flex-direction: column; gap: 8px; padding: 0 10px 10px; }
    .door { margin-top: 8px; background: #f5f5f4; border-radius: 12px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .door strong { font-size: 18px; letter-spacing: .03em; }
    .unavail { background: #fff7ed; color: #9a3412; border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
    .unavail button { margin-top: 6px; }
    .summary.warn { color: #9a3412; font-weight: 800; }
    .summary.ok { color: #047857; font-weight: 800; }
    .clash { margin: 14px 0; background: #fff7ed; border: 1px solid #fdba74; border-radius: 14px; padding: 12px; }
    .clash p { margin: 0 0 8px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .prop-card, .staff-card, .panel { padding: 14px; }
    .prop-card h3, .staff-card h3 { margin: 0; font-size: 1.05rem; }
    .totals { display: flex; gap: 8px; margin: 10px 0 4px; }
    .totals span { flex: 1; background: #f5f5f4; border-radius: 12px; padding: 8px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .totals strong { display: block; margin-top: 2px; font-size: 1.35rem; letter-spacing: 0; text-transform: none; color: var(--ink); }
    .totals .completed strong { color: #166534; }
    .totals .acknowledged strong { color: #14532d; }
    .totals .outstanding strong { color: #9a3412; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .row-actions .btn { flex: 1 1 140px; }
    .dot { width: 12px; height: 12px; border-radius: 99px; display: inline-block; margin-right: 6px; }
    .person { display: flex; align-items: center; }
    .sheet { position: fixed; inset: 0; z-index: 20000; display: flex; align-items: flex-end; justify-content: center; }
    .backdrop { position: absolute; inset: 0; border: 0; background: rgba(28,25,23,.45); }
    .sheet-card { position: relative; width: min(560px, 100%); max-height: min(92vh, 840px); overflow: auto; background: #fff; border-radius: 22px 22px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice { min-height: 44px; border-radius: 999px; border: 1px solid #d6d3d1; background: #fff; padding: 8px 12px; font-weight: 700; }
    .choice[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
    .pick { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 12px; margin-top: 8px; }
    .pick strong, .pick span { display: block; }
    .pick.on { border-color: var(--green); background: #f0fdf8; }
    .pay-box { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 12px 0; }
    .pay-mark { margin: 0 0 8px; font-size: 1.35rem; font-weight: 800; }
    .report h2 { margin: 18px 0 8px; }
    .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
    .report-kpi { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .report-kpi span { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .report-kpi strong { display: block; margin-top: 4px; font-size: 2rem; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .detail-tile { background: #f8fafc; border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
    .detail-tile.wide { grid-column: 1 / -1; }
    .detail-tile .tile-label { display: block; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .detail-tile strong { display: block; margin-top: 4px; font-size: 1.02rem; font-weight: 750; word-break: break-word; }
    .detail-tile strong.person { display: flex; align-items: center; }
    .detail-tile.code strong { font-size: 1.45rem; letter-spacing: .04em; }
    .detail-tile .btn { margin-top: 8px; }
    .sheet-card.visit-card { width: min(440px, 100%); background: #f3f4f6; }
    .visit-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .visit-date { margin: 0; color: #6b7280; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .visit-card h2 { margin: 2px 0 0; font-size: 1.7rem; }
    .visit-tools { display: flex; gap: 8px; }
    .visit-close, .visit-menu summary { width: 42px; height: 42px; border-radius: 999px; border: 1px solid #e5e7eb; background: #fff; display: grid; place-items: center; font-weight: 800; }
    .visit-menu { position: relative; }
    .visit-menu summary { list-style: none; cursor: pointer; }
    .visit-menu summary::-webkit-details-marker { display: none; }
    .visit-menu-list { position: absolute; right: 0; top: 48px; z-index: 2; min-width: 220px; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px rgba(28,25,23,.12); }
    .visit-when { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0; }
    .visit-time { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 1.05rem; font-weight: 800; }
    .visit-ico { width: 20px; height: 20px; flex: 0 0 auto; }
    .visit-cleaner, .visit-row, .visit-pay { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; }
    .visit-cleaner { display: flex; align-items: center; gap: 12px; padding: 12px; }
    .visit-avatar { width: 42px; height: 42px; border-radius: 14px; background: #e5e7eb; display: grid; place-items: center; font-weight: 800; }
    .visit-cleaner .tile-label, .visit-row .tile-label, .visit-pay .tile-label { color: #6b7280; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .visit-row { display: flex; align-items: center; gap: 12px; padding: 12px; margin-top: 8px; }
    .visit-row .grow, .visit-cleaner .grow { flex: 1; min-width: 0; }
    .visit-row strong, .visit-cleaner strong, .visit-pay strong { display: block; margin-top: 2px; }
    .visit-chip { min-height: 36px; border: 1px solid #e5e7eb; border-radius: 999px; background: #fff; padding: 6px 12px; font-weight: 750; text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 6px; }
    .visit-section { margin: 18px 0 8px; font-size: 1.05rem; }
    .visit-step { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 10px 2px; text-align: left; font-weight: 750; }
    .visit-step.scheduled { color: #7f1d1d; }
    .visit-step.acknowledged { color: #14532d; }
    .visit-step.completed { color: #166534; }
    .visit-dot { width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto; }
    .visit-dot.scheduled { background: #fecaca; box-shadow: inset 0 0 0 2px #b91c1c; }
    .visit-dot.acknowledged { background: #bbf7d0; box-shadow: inset 0 0 0 2px #16a34a; }
    .visit-dot.completed { background: #166534; }
    .visit-bill { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .visit-tick { display: flex; align-items: center; gap: 10px; min-height: 72px; padding: 12px; text-align: left; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; font-weight: 800; }
    .visit-tick .box { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #fecaca; border: 2px solid #b91c1c; color: transparent; font-size: 18px; line-height: 1; }
    .visit-tick.on .box { background: #166534; border-color: #166534; color: #fff; }
    .visit-tick.on .box::before { content: "✓"; }
    .visit-tick:disabled { opacity: 1; }
    .visit-done { width: 100%; min-height: 54px; margin-top: 16px; border: 0; border-radius: 999px; background: #111827; color: #fff; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .visit-done .visit-ico { width: 18px; height: 18px; }
    .report-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .report-table th, .report-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .report-table th { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .report-table tr.on { background: #f0fdf8; }
    .report-table button { border: 0; background: transparent; padding: 0; font-weight: 800; color: var(--green); }
    .code-box { background: #f0fdf8; border: 1px solid #bbf7d0; border-radius: 16px; padding: 14px; margin: 12px 0; }
    .code-box span { color: var(--muted); font-size: 13px; font-weight: 800; text-transform: uppercase; }
    .code-box strong { display: block; font-size: 32px; letter-spacing: .04em; margin: 4px 0 8px; word-break: break-word; }
    .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30000; width: min(460px, calc(100% - 24px)); background: #1c1917; color: #fff; padding: 12px 14px; border-radius: 14px; text-align: center; }
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); }
    .bottom-nav button { min-height: 48px; border: 0; border-radius: 12px; background: transparent; font-weight: 800; }
    .bottom-nav button.on { background: #e7f6f1; color: var(--green); }
    @media (min-width: 800px) {
      body { padding-bottom: 24px; }
      .tabs { display: flex; }
      .bottom-nav { display: none !important; }
      .toast { bottom: 24px; }
      .tabs button { min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid #d6d3d1; background: #fff; font-weight: 800; }
      .tabs button.on { background: var(--green); color: #fff; border-color: var(--green); }
    }
    @media (min-width: 1100px) {
      .wrap { width: min(1280px, calc(100% - 32px)); }
      .gcal { max-height: calc(100dvh - 210px); }
    }
    body.kiosk { height: 100dvh; overflow: hidden; padding-bottom: 0; }
    body.kiosk #shell { height: 100dvh; display: flex; flex-direction: column; }
    body.kiosk .wrap { width: 100%; max-width: none; height: 100%; margin: 0; padding: 8px 10px; display: flex; flex-direction: column; min-height: 0; }
    body.kiosk.mode-manager .wrap { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
    body.kiosk .top { align-items: center; }
    body.kiosk .eyebrow { display: none; }
    body.kiosk h1 { font-size: 1.05rem; margin: 0; }
    body.kiosk .who { margin: 0; font-size: 13px; }
    body.kiosk .tabs, body.kiosk .weekbar { margin: 4px 0; }
    body.kiosk .filters { padding-bottom: 4px; }
    body.kiosk #toolbar { flex: 0 0 auto; }
    body.kiosk #view { flex: 1 1 auto; min-height: 0; overflow: auto; }
    body.kiosk #view.fill { display: flex; flex-direction: column; overflow: hidden; }
    body.kiosk .gcal { flex: 1 1 auto; min-height: 0; max-height: none; height: auto; border-radius: 10px; }
    body.kiosk #view.fill .panel { flex: 0 1 auto; max-height: 22vh; overflow: auto; }
    @media (min-width: 800px) {
      body.kiosk.mode-manager .wrap { padding-bottom: 8px; }
    }
  </style>
</head>
<body>
  <p id="boot" class="wrap">Loading schedule…</p>
  <div id="gate" hidden>
    <form id="loginForm" class="login-card">
      <p class="eyebrow">Elite Cleaning Services</p>
      <h1>Elite Task Manager</h1>
      <p>Sign in with your admin password. Staff do not use this page — send each person the private link from Staff.</p>
      <p id="loginError" class="error" hidden></p>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </div>
  <div id="shell" hidden>
    <div class="wrap">
      <header class="top">
        <div>
          <p class="eyebrow">Elite Cleaning Services</p>
          <h1>Elite Task Manager</h1>
          <p id="who" class="who"></p>
        </div>
        <button class="refresh" type="button" data-action="refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
        </button>
      </header>
      <div id="tabs" class="tabs"></div>
      <div id="toolbar"></div>
      <div id="view"></div>
    </div>
    <nav id="bottomNav" class="bottom-nav" aria-label="Sections"></nav>
  </div>
