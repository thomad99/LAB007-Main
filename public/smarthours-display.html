<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Opening Hours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700&family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFFFFF;
    }
    #stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #FFFFFF;
    }
    #tablet {
      position: relative;
      width: 800px;
      height: 480px;
      overflow: hidden;
      transform-origin: center center;
      background: #FFFFFF;
    }
    .el { position: absolute; overflow: hidden; }
    .logo { max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: 0 auto; }
    .title {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-weight: 700; line-height: 1.15;
      padding: 4px 8px;
    }
    .status-text {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-weight: 800; letter-spacing: .04em;
    }
    .status-badge {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-weight: 900; letter-spacing: .08em;
      border-radius: 12px;
    }
    .status-img, .slide-img {
      width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;
    }
    .custom-img {
      width: 100%; height: 100%; display: block; object-fit: cover; object-position: center;
    }
    .custom-text {
      width: 100%; height: 100%;
      display: flex; align-items: center;
      line-height: 1.2; padding: 4px 8px;
      white-space: pre-wrap; word-break: break-word;
    }
    .hours {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center;
      gap: 4px; padding: 4px 8px; overflow: hidden;
    }
    .hours .row {
      display: flex; justify-content: space-between; gap: 12px;
      font-weight: 600; line-height: 1.25;
    }
    .err {
      color: #fff; font: 16px/1.4 system-ui, sans-serif;
      padding: 24px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="stage"><div id="tablet"></div></div>
  <script>
    (function () {
      const DAYS = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
      const tablet = document.getElementById('tablet');
      const stage = document.getElementById('stage');
      const parts = location.pathname.split('/').filter(Boolean);
      const slug = decodeURIComponent(parts[parts.length - 1] || '');
      let slideTimer = null;
      let statusTimer = null;
      let slideIndex = 0;
      let slideUrls = [];
      let screenW = 800;
      let screenH = 480;
      let hangRotation = 0;
      let liveDesign = null;
      let liveHours = null;

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatDay(day) {
        if (!day || day.closed) return 'Closed';
        const a = day.open && day.close ? `${day.open} – ${day.close}` : '';
        const b = day.open2 && day.close2 ? `${day.open2} – ${day.close2}` : '';
        return b ? `${a}, ${b}` : (a || 'Closed');
      }

      /** Open/closed from store hours vs the tablet's current local date/time. */
      function isOpenNow(hours, date) {
        const now = date || new Date();
        const dayKey = DAYS[(now.getDay() + 6) % 7];
        const day = hours && hours[dayKey];
        if (!day || day.closed) return false;
        const mins = now.getHours() * 60 + now.getMinutes();
        const inSlot = (open, close) => {
          if (!open || !close) return false;
          const [oh, om] = String(open).split(':').map(Number);
          const [ch, cm] = String(close).split(':').map(Number);
          if (![oh, om, ch, cm].every(Number.isFinite)) return false;
          const start = oh * 60 + om;
          let end = ch * 60 + cm;
          if (end <= start) end += 24 * 60;
          const cur = mins < start && end > 24 * 60 ? mins + 24 * 60 : mins;
          return cur >= start && cur < end;
        };
        return inSlot(day.open, day.close) || inSlot(day.open2, day.close2);
      }

      function normalizeHangRotation(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return 0;
        const r = ((Math.round(n) % 360) + 360) % 360;
        if (r === 90 || r === 180 || r === 270) return r;
        return 0;
      }

      function fit() {
        const swap = hangRotation === 90 || hangRotation === 270;
        const boxW = swap ? screenH : screenW;
        const boxH = swap ? screenW : screenH;
        const scale = Math.min(stage.clientWidth / boxW, stage.clientHeight / boxH);
        tablet.style.transform = `rotate(${hangRotation}deg) scale(${scale})`;
      }

      function resolveFontSize(el, design) {
        const n = Number(el && el.fontSize);
        if (Number.isFinite(n) && n > 0) return Math.max(10, Math.min(220, Math.round(n)));
        const d = design || {};
        if (el && el.type === 'title') return Number(d.titleFontSize) || 28;
        if (el && el.type === 'hours') return Number(d.hoursFontSize) || 18;
        if (el && el.type === 'status') return Number(d.statusFontSize) || 36;
        return 28;
      }

      function resolveFontFamily(el, design) {
        return (el && el.fontFamily) || (design && design.fontFamily) || '"DM Sans", system-ui, sans-serif';
      }

      function resolveStatusColors(el, design, openNow) {
        const accent = (design && design.accentColor) || '#FF0000';
        const fg = (design && design.textColor) || '#000000';
        const mode = (design && design.statusMode) || 'badge';
        if (openNow) {
          return {
            box: (el && el.boxColor) || accent,
            font: (el && el.fontColor) || (mode === 'text' ? accent : '#000000')
          };
        }
        return {
          box: (el && el.closedBoxColor) || '#000000',
          font: (el && el.closedFontColor) || (mode === 'text' ? fg : '#FFFFFF')
        };
      }

      function renderStatus(design, open, el) {
        const mode = design.statusMode || 'badge';
        if (mode === 'image') {
          const url = open ? design.openImageUrl : design.closedImageUrl;
          if (url) return `<img class="status-img" src="${escapeHtml(url)}" alt="${open ? 'Open' : 'Closed'}">`;
        }
        const fs = resolveFontSize(el || { type: 'status' }, design);
        const ff = resolveFontFamily(el || { type: 'status' }, design);
        const colors = resolveStatusColors(el, design, open);
        return `<div class="status-badge" style="font-size:${fs}px;font-family:${escapeHtml(ff)};background:${escapeHtml(colors.box)};color:${escapeHtml(colors.font)}">${open ? 'OPEN' : 'CLOSED'}</div>`;
      }

      function refreshStatus() {
        if (!liveDesign || !liveHours) return;
        const open = isOpenNow(liveHours);
        tablet.querySelectorAll('[data-status]').forEach((node) => {
          const el = {
            type: 'status',
            fontSize: Number(node.dataset.fontSize) || undefined,
            fontFamily: node.dataset.fontFamily || undefined,
            boxColor: node.dataset.boxColor || '',
            fontColor: node.dataset.fontColor || '',
            closedBoxColor: node.dataset.closedBoxColor || '',
            closedFontColor: node.dataset.closedFontColor || ''
          };
          node.innerHTML = renderStatus(liveDesign, open, el);
          node.dataset.open = open ? '1' : '0';
        });
      }

      function startSlideshow(intervalSec) {
        if (slideTimer) clearInterval(slideTimer);
        if (slideUrls.length < 2) return;
        slideTimer = setInterval(() => {
          slideIndex = (slideIndex + 1) % slideUrls.length;
          const img = tablet.querySelector('[data-slideshow-img]');
          if (img) img.src = slideUrls[slideIndex];
        }, Math.max(2, intervalSec || 8) * 1000);
      }

      async function load() {
        if (!slug) {
          tablet.innerHTML = '<div class="err">Missing customer.</div>';
          return;
        }
        const res = await fetch('/api/smarthours/public/' + encodeURIComponent(slug) + '?t=' + Date.now());
        if (!res.ok) {
          tablet.innerHTML = '<div class="err">Hours page not found.</div>';
          return;
        }
        const data = await res.json();
        const design = data.design || {};
        const hours = data.hours || {};
        const days = data.days || DAYS;
        const labels = data.dayLabels || {};
        const open = isOpenNow(hours);
        const tabletInfo = data.tablet || data.eink || {};
        const einkInfo = data.eink || {};
        const panelInfo = data.panel || {};
        screenW = Math.max(200, Number(tabletInfo.width) || 800);
        screenH = Math.max(120, Number(tabletInfo.height) || 480);
        // Same bake as display.png — portrait adds 90° because the panel cannot rotate
        hangRotation = data.outputRotation != null
          ? normalizeHangRotation(data.outputRotation)
          : normalizeHangRotation(
              (einkInfo.orientation === 'portrait' ? 90 : 0) + (Number(einkInfo.hangRotation) || 0)
            );
        tablet.style.width = screenW + 'px';
        tablet.style.height = screenH + 'px';
        document.title = (data.name || 'Hours') + ' · SmartHours';
        tablet.dataset.panelW = String(panelInfo.width || einkInfo.width || Math.max(screenW, screenH));
        tablet.dataset.panelH = String(panelInfo.height || einkInfo.height || Math.min(screenW, screenH));
        const bg = design.backgroundColor || '#FFFFFF';
        tablet.style.background = bg;
        stage.style.background = bg;
        document.documentElement.style.background = bg;
        document.body.style.background = bg;
        tablet.style.color = design.textColor || '#000000';
        tablet.style.fontFamily = design.fontFamily || '"DM Sans", system-ui, sans-serif';
        tablet.innerHTML = '';
        slideUrls = Array.isArray(design.slideshowUrls) ? design.slideshowUrls.slice() : [];
        slideIndex = 0;
        liveDesign = design;
        liveHours = hours;

        (design.layout || []).forEach((el) => {
          const node = document.createElement('div');
          node.className = 'el';
          node.style.left = el.x + 'px';
          node.style.top = el.y + 'px';
          node.style.width = el.w + 'px';
          node.style.height = el.h + 'px';

          if (el.type === 'logo' && design.logoUrl) {
            node.innerHTML = `<img class="logo" src="${escapeHtml(design.logoUrl)}" alt="">`;
          } else if (el.type === 'title') {
            const fs = resolveFontSize(el, design);
            const ff = resolveFontFamily(el, design);
            node.innerHTML = `<div class="title" style="font-size:${fs}px;font-family:${escapeHtml(ff)}">${escapeHtml(data.name)}</div>`;
          } else if (el.type === 'status') {
            node.dataset.status = '1';
            node.dataset.fontSize = String(resolveFontSize(el, design));
            node.dataset.fontFamily = resolveFontFamily(el, design);
            node.dataset.boxColor = el.boxColor || '';
            node.dataset.fontColor = el.fontColor || '';
            node.dataset.closedBoxColor = el.closedBoxColor || '';
            node.dataset.closedFontColor = el.closedFontColor || '';
            node.innerHTML = renderStatus(design, open, el);
          } else if (el.type === 'slideshow' && slideUrls.length) {
            node.innerHTML = `<img class="slide-img" data-slideshow-img src="${escapeHtml(slideUrls[0])}" alt="">`;
          } else if (el.type === 'hours') {
            const fs = resolveFontSize(el, design);
            const ff = resolveFontFamily(el, design);
            node.innerHTML = `<div class="hours" style="font-size:${fs}px;font-family:${escapeHtml(ff)}">${
              days.map((day) => `<div class="row"><span>${escapeHtml(labels[day] || day)}</span><span style="color:${design.accentColor || '#FF0000'}">${escapeHtml(formatDay(hours[day]))}</span></div>`).join('')
            }</div>`;
          } else if (el.type === 'text') {
            const align = el.align === 'left' || el.align === 'right' ? el.align : 'center';
            const justify = align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center';
            const color = el.color || design.textColor || '#000000';
            const fs = resolveFontSize(el, design);
            const ff = resolveFontFamily(el, design);
            node.innerHTML = `<div class="custom-text" style="justify-content:${justify};text-align:${align};font-size:${fs}px;font-family:${escapeHtml(ff)};color:${escapeHtml(color)};font-weight:${el.bold === false ? 400 : 700}">${escapeHtml(el.text || '')}</div>`;
          } else if (el.type === 'image' && el.imageUrl) {
            const fitMode = el.fit === 'contain' ? 'contain' : 'cover';
            node.innerHTML = `<img class="custom-img" style="object-fit:${fitMode}" src="${escapeHtml(el.imageUrl)}" alt="">`;
          } else if (el.type === 'sketch' && el.dataUrl) {
            node.innerHTML = `<img class="custom-img" style="object-fit:contain;background:transparent" src="${escapeHtml(el.dataUrl)}" alt="Sketch">`;
          }
          tablet.appendChild(node);
        });
        fit();
        startSlideshow(design.slideshowIntervalSec);
        if (statusTimer) clearInterval(statusTimer);
        statusTimer = setInterval(refreshStatus, 30 * 1000);
      }

      window.addEventListener('resize', fit);
      load().catch(() => {
        tablet.innerHTML = '<div class="err">Could not load hours.</div>';
      });
      // Refresh hours data periodically; status also ticks every 30s from local clock
      setInterval(() => { load().catch(() => {}); }, 5 * 60 * 1000);
    })();
  </script>
</body>
</html>
