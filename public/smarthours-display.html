<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Opening Hours</title>
  <link rel="icon" type="image/png" href="/smarthours-assets/smarthours-logo.png">
  <link rel="apple-touch-icon" href="/smarthours-assets/smarthours-logo.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
    }
    #tablet {
      position: relative;
      width: 800px;
      height: 480px;
      overflow: hidden;
      transform-origin: center center;
    }
    .el { position: absolute; overflow: hidden; }
    .logo { max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: 0 auto; }
    .title { font-weight: 800; text-align: center; line-height: 1.15; width: 100%; }
    .custom-text {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      line-height: 1.2;
      padding: 4px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: hidden;
    }
    .custom-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 8px;
    }
    .status-text {
      text-align: center;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      width: 100%;
    }
    .status-badge {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 18px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .status-img, .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }
    .hours { width: 100%; }
    .hours .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 2px;
      border-bottom: 1px solid rgba(0,0,0,.12);
      font-weight: 600;
    }
    .err {
      color: #ffb4b4;
      font-family: Segoe UI, Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="tablet"></div>
  </div>
  <script>
    (function () {
      const tablet = document.getElementById('tablet');
      const stage = document.getElementById('stage');
      const parts = location.pathname.split('/').filter(Boolean);
      const slug = decodeURIComponent(parts[parts.length - 1] || '');
      let slideTimer = null;
      let slideIndex = 0;
      let slideUrls = [];
      let screenW = 800;
      let screenH = 480;

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatDay(day) {
        if (!day || day.closed) return 'Closed';
        const a = day.open && day.close ? `${day.open} – ${day.close}` : '';
        const b = day.open2 && day.close2 ? `${day.open2} – ${day.close2}` : '';
        return b ? `${a}, ${b}` : (a || 'Closed');
      }

      function fit() {
        const scale = Math.min(stage.clientWidth / screenW, stage.clientHeight / screenH);
        tablet.style.transform = `scale(${scale})`;
      }

      function renderStatus(design, open) {
        const mode = design.statusMode || 'badge';
        if (mode === 'image') {
          const url = open ? design.openImageUrl : design.closedImageUrl;
          if (url) return `<img class="status-img" src="${escapeHtml(url)}" alt="${open ? 'Open' : 'Closed'}">`;
        }
        if (mode === 'text') {
          return `<div class="status-text" style="font-size:${Math.min(design.statusFontSize || 28, 36)}px;color:${open ? (design.accentColor || '#FF0000') : '#000000'}">${open ? 'Open Now' : 'Closed Now'}</div>`;
        }
        return `<div class="status-badge" style="font-size:${design.statusFontSize || 36}px;background:${open ? (design.accentColor || '#FF0000') : '#000000'};color:${design.backgroundColor || '#FFFFFF'}">${open ? 'OPEN' : 'CLOSED'}</div>`;
      }

      function startSlideshow(intervalSec) {
        if (slideTimer) clearInterval(slideTimer);
        if (slideUrls.length < 2) return;
        slideTimer = setInterval(() => {
          slideIndex = (slideIndex + 1) % slideUrls.length;
          const img = tablet.querySelector('[data-slideshow-img]');
          if (img) img.src = slideUrls[slideIndex];
        }, Math.max(2, intervalSec || 8) * 1000);
      }

      async function load() {
        if (!slug) {
          tablet.innerHTML = '<div class="err">Missing customer.</div>';
          return;
        }
        const res = await fetch('/api/smarthours/public/' + encodeURIComponent(slug));
        if (!res.ok) {
          tablet.innerHTML = '<div class="err">Hours page not found.</div>';
          return;
        }
        const data = await res.json();
        const design = data.design || {};
        const hours = data.hours || {};
        const days = data.days || ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
        const labels = data.dayLabels || {};
        const open = !!data.openNow;
        const tabletInfo = data.tablet || data.eink || {};
        screenW = Math.max(200, Number(tabletInfo.width) || 800);
        screenH = Math.max(120, Number(tabletInfo.height) || 480);
        tablet.style.width = screenW + 'px';
        tablet.style.height = screenH + 'px';
        document.title = (data.name || 'Hours') + ' · SmartHours';
        tablet.style.background = design.backgroundColor || '#FFFFFF';
        tablet.style.color = design.textColor || '#000000';
        tablet.style.fontFamily = design.fontFamily || 'Georgia, serif';
        tablet.innerHTML = '';
        slideUrls = Array.isArray(design.slideshowUrls) ? design.slideshowUrls.slice() : [];
        slideIndex = 0;

        (design.layout || []).forEach((el) => {
          const node = document.createElement('div');
          node.className = 'el';
          node.style.left = el.x + 'px';
          node.style.top = el.y + 'px';
          node.style.width = el.w + 'px';
          node.style.height = el.h + 'px';

          if (el.type === 'logo' && design.logoUrl) {
            node.innerHTML = `<img class="logo" src="${escapeHtml(design.logoUrl)}" alt="">`;
          } else if (el.type === 'title') {
            node.innerHTML = `<div class="title" style="font-size:${design.titleFontSize || 28}px">${escapeHtml(data.name)}</div>`;
          } else if (el.type === 'status') {
            node.innerHTML = renderStatus(design, open);
          } else if (el.type === 'slideshow' && slideUrls.length) {
            node.innerHTML = `<img class="slide-img" data-slideshow-img src="${escapeHtml(slideUrls[0])}" alt="">`;
          } else if (el.type === 'hours') {
            node.innerHTML = `<div class="hours" style="font-size:${design.hoursFontSize || 18}px">${
              days.map((day) => `<div class="row"><span>${escapeHtml(labels[day] || day)}</span><span style="color:${design.accentColor || '#FF0000'}">${escapeHtml(formatDay(hours[day]))}</span></div>`).join('')
            }</div>`;
          } else if (el.type === 'text') {
            const align = el.align === 'left' || el.align === 'right' ? el.align : 'center';
            const justify = align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center';
            const color = el.color || design.textColor || '#000000';
            node.innerHTML = `<div class="custom-text" style="justify-content:${justify};text-align:${align};font-size:${el.fontSize || 28}px;color:${escapeHtml(color)};font-weight:${el.bold === false ? 400 : 700}">${escapeHtml(el.text || '')}</div>`;
          } else if (el.type === 'image' && el.imageUrl) {
            const fitMode = el.fit === 'contain' ? 'contain' : 'cover';
            node.innerHTML = `<img class="custom-img" style="object-fit:${fitMode}" src="${escapeHtml(el.imageUrl)}" alt="">`;
          }
          tablet.appendChild(node);
        });
        fit();
        startSlideshow(design.slideshowIntervalSec);
      }

      window.addEventListener('resize', fit);
      load().catch(() => {
        tablet.innerHTML = '<div class="err">Could not load hours.</div>';
      });
      setInterval(() => { load().catch(() => {}); }, 5 * 60 * 1000);
    })();
  </script>
</body>
</html>
