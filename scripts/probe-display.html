<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 800px; height: 480px; overflow: hidden;
    background: #FFFFFF; color: #000000; font-family: Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  #tablet { position: relative; width: 800px; height: 480px; overflow: hidden; background: #FFFFFF; }
  .el { position: absolute; overflow: hidden; }
  .logo { max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: 0 auto; }
  .title { font-weight: 800; text-align: center; line-height: 1.15; width: 100%; }
  .custom-text {
    width: 100%; height: 100%; display: flex; align-items: center; line-height: 1.2;
    padding: 4px; white-space: pre-wrap; word-break: break-word; overflow: hidden;
  }
  .custom-img, .status-img, .slide-img {
    width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 10px;
  }
  .status-text {
    text-align: center; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; width: 100%;
  }
  .status-badge {
    width: 100%; height: 100%; display: grid; place-items: center; border-radius: 16px;
    font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
  }
  .hours { width: 100%; }
  .hours .row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 8px 2px; border-bottom: 1px solid rgba(0,0,0,.12); font-weight: 600;
  }
</style>
</head>
<body>
  <div id="tablet"><div class="el" style="left:24px;top:77px;width:752px;height:48px"><div class="title" style="font-size:28px;color:#000000">Elite Cleaning Services</div></div><div class="el" style="left:24px;top:134px;width:752px;height:77px"><div class="status-badge" style="font-size:36px;background:#000000;color:#FFFFFF">CLOSED</div></div><div class="el" style="left:24px;top:230px;width:752px;height:234px"><div class="hours" style="font-size:18px;color:#000000"><div class="row"><span>MON</span><span style="color:#FF0000">09:00 – 17:00</span></div><div class="row"><span>TUE</span><span style="color:#FF0000">09:00 – 17:00</span></div><div class="row"><span>WED</span><span style="color:#FF0000">09:00 – 17:00</span></div><div class="row"><span>THU</span><span style="color:#FF0000">09:00 – 17:00</span></div><div class="row"><span>FRI</span><span style="color:#FF0000">09:00 – 17:00</span></div><div class="row"><span>SAT</span><span style="color:#FF0000">09:00 – 17:00</span></div><div class="row"><span>SUN</span><span style="color:#FF0000">Closed</span></div></div></div></div>
</body>
</html>
